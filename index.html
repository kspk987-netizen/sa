        "<div class='sub'>Stops are stored as structured records so the system can calculate progress, arrival estimates, demand and delay patterns.</div>" +
        "<div class='card'><div class='card-head'><h3>" + PARA.esc(route.name) + " (" + PARA.esc(route.code) + ")</h3>" +
          "<button class='btn ghost sm' id='edit-route'>Edit route details</button></div>" +
          "<div class='grid g4'>" +
            "<div><div class='card-note'>Start point</div><strong>" + PARA.esc(route.startPoint) + "</strong></div>" +
            "<div><div class='card-note'>End point</div><strong>" + PARA.esc(route.endPoint) + "</strong></div>" +
            "<div><div class='card-note'>Service hours</div><strong>" + PARA.esc(route.operatingHours.start) + "–" + PARA.esc(route.operatingHours.end) + "</strong></div>" +
            "<div><div class='card-note'>Stops / distance</div><strong>" + stops.length + " · " + PARA.esc(route.distanceKm) + " km</strong></div>" +
          "</div>" +
          (route.description ? "<p class='hint' style='margin-top:12px'>" + PARA.esc(route.description) + "</p>" : "") +
        "</div>" +
        "<div class='card pad-0'>" +
          "<div class='card-head' style='padding:16px 18px 0'><h3>Stops in order</h3>" +
            "<div class='pill-row'><button class='btn sm' id='add-stop'>Add stop</button>" +
            "<span class='card-note'>Use ↑ ↓ to change the running order</span></div></div>" +
          "<div class='table-wrap'><table class='t'>" +
          "<thead><tr><th>Order</th><th>Stop</th><th>Location</th><th class='num'>Lat</th><th class='num'>Lng</th>" +

            if (s.accessible) flags.push("Accessible");

              "<td><strong>" + s.position + "</strong></td>" +
              "<td><strong>" + PARA.esc(s.name) + "</strong><div class='stop-meta'>" + PARA.esc(s.code) + "</div></td>" +
              "<td>" + PARA.esc(s.location || "—") + "</td>" +
              "<td class='num'>" + (s.lat != null ? s.lat.toFixed(4) : "—") + "</td>" +
              "<td class='num'>" + (s.lng != null ? s.lng.toFixed(4) : "—") + "</td>" +
              "<td class='num'>" + (s.travelFromPrev == null ? "—" : s.travelFromPrev) + "</td>" +
              "<td class='num'>" + (s.travelToNext == null ? "—" : s.travelToNext) + "</td>" +
              "<td class='num'>" + (d.requests != null ? d.requests : 0) + "</td>" +
              "<td class='num'>" + (d.avgWait != null ? PARA.fmt.mins(d.avgWait) : "—") + "</td>" +

                "<button class='btn ghost sm' data-editstop='" + s.id + "'>Edit</button>" +
                "<button class='btn ghost sm' data-del='" + s.id + "'>Delete</button>" +
              "</div></td></tr>";

        "</tbody></table></div></div>";

            PARA.ui.toast("Route updated", "good");
            render();
          }
        });
      });

          "<div class='row2'>" +
            PARA.ui.field("Minutes from previous stop", "<input class='in' type='number' name='fromPrev' value='" + (s.travelFromPrev != null ? s.travelFromPrev : "") + "'>") +
            PARA.ui.field("Minutes to next stop", "<input class='in' type='number' name='toNext' value='" + (s.travelToNext != null ? s.travelToNext : "") + "'>") +
          "</div>" +
          "<div class='row3'>" +
            "<label class='chk'><input type='checkbox' name='shelter'" + (s.shelter ? " checked" : "") + "><span>Shelter</span></label>" +
            "<label class='chk'><input type='checkbox' name='seating'" + (s.seating ? " checked" : "") + "><span>Seating</span></label>" +
            "<label class='chk'><input type='checkbox' name='accessible'" + (s.accessible !== false ? " checked" : "") + "><span>Accessible</span></label>" +
          "</div>" +
          PARA.ui.field("Notes", "<textarea class='in' name='notes'>" + PARA.esc(s.notes || "") + "</textarea>");
      }

      root.querySelector("#add-stop").addEventListener("click", function () {
        PARA.ui.modal({
          title: "Add stop", body: stopForm(null),
          onOk: function (box) {
            var g = function (n) { var el = box.querySelector("[name='" + n + "']"); return el ? el.value.trim() : ""; };
            var ck = function (n) { var el = box.querySelector("[name='" + n + "']"); return !!(el && el.checked); };
            if (db.stops.some(function (x) { return x.code.toLowerCase() === g("code").toLowerCase(); })) { PARA.ui.toast("Stop code already exists", "bad"); return false; }
            var last = stops[stops.length - 1];
            var st = {
              id: PARA.store.uid("stp"), code: g("code"), name: g("name"), location: g("location"),
              lat: g("lat") ? Number(g("lat")) : (last ? last.lat - 0.002 : 0),
              lng: g("lng") ? Number(g("lng")) : (last ? last.lng - 0.002 : 0),
              routeId: route.id, position: g("position") ? Number(g("position")) : stops.length + 1,
              travelFromPrev: g("fromPrev") ? Number(g("fromPrev")) : 5,
              travelToNext: g("toNext") ? Number(g("toNext")) : 5,
              demand: 0, avgWaitMin: null, shelter: ck("shelter"), seating: ck("seating"),
              accessible: ck("accessible"), notes: g("notes"), eta: null, updatedAt: new Date().toISOString()
            };
            db.stops.push(st);
            if (st.position > stops.length) {
              db.stops.forEach(function (x) { if (x.routeId === route.id && x.position > st.position) x.position++; });
            }
            PARa_record("add_stop", "stop", st.id, "Added " + st.code + " " + st.name);
            PARA.store.save();
            PARA.ui.toast("Stop added", "good");
            render();
          }
        });
      });

      root.querySelectorAll("[data-editstop]").forEach(function (b) {
        b.addEventListener("click", function () {
          var s = db.stops.filter(function (x) { return x.id === b.getAttribute("data-editstop"); })[0];
          PARA.ui.modal({
            title: "Edit " + s.name, body: stopForm(s),
            onOk: function (box) {
              var g = function (n) { var el = box.querySelector("[name='" + n + "']"); return el ? el.value.trim() : ""; };
              var ck = function (n) { var el = box.querySelector("[name='" + n + "']"); return !!(el && el.checked); };
              s.name = g("name"); s.code = g("code"); s.location = g("location");
              s.lat = g("lat") ? Number(g("lat")) : s.lat;
              s.lng = g("lng") ? Number(g("lng")) : s.lng;
              s.travelFromPrev = g("fromPrev") ? Number(g("fromPrev")) : null;
              s.travelToNext = g("toNext") ? Number(g("toNext")) : null;
              s.shelter = ck("shelter"); s.seating = ck("seating"); s.accessible = ck("accessible");
              s.notes = g("notes");
              if (g("position") && Number(g("position")) !== s.position) {
                var target = Math.max(1, Number(g("position")));
                var ordered = PARA.geo.stops(route.id);
                var moved = ordered.splice(ordered.findIndex(function (x) { return x.id === s.id; }), 1)[0];
                ordered.splice(Math.min(target - 1, ordered.length), 0, moved);
                ordered.forEach(function (x, i) { x.position = i + 1; });
              }
              PARa_record("update_stop", "stop", s.id, "Updated " + s.code);
              PARA.store.save();
              PARA.ui.toast("Stop updated", "good");
              render();
            }
          });
        });
      });

      function move(id, dir) {
        var ordered = PARA.geo.stops(route.id);
        var i = ordered.findIndex(function (x) { return x.id === id; });
        var j = i + dir;
        if (i < 0 || j < 0 || j >= ordered.length) return;
        var tmp = ordered[i]; ordered[i] = ordered[j]; ordered[j] = tmp;
        ordered.forEach(function (x, k) { x.position = k + 1; });
        PARA.store.save();
        render();
      }
      root.querySelectorAll("[data-up]").forEach(function (b) { b.addEventListener("click", function () { move(b.getAttribute("data-up"), -1); }); });
      root.querySelectorAll("[data-down]").forEach(function (b) { b.addEventListener("click", function () { move(b.getAttribute("data-down"), 1); }); });

      root.querySelectorAll("[data-del]").forEach(function (b) {
        b.addEventListener("click", function () {
          var s = db.stops.filter(function (x) { return x.id === b.getAttribute("data-del"); })[0];
          var used = db.requests.filter(function (q) { return q.originId === s.id || q.destId === s.id; }).length;
          PARA.ui.confirm("Delete stop", "Remove " + s.name + " from the route?" + (used ? " It is referenced by " + used + " passenger request(s); those records stay but the stop will no longer be selectable." : ""), function () {
            db.stops = db.stops.filter(function (x) { return x.id !== s.id; });
            PARA.geo.stops(route.id).forEach(function (x, i) { x.position = i + 1; });
            PARa_record("delete_stop", "stop", s.id, "Deleted " + s.code);
            PARA.store.save();
            PARA.ui.toast("Stop deleted");
            render();
          }, "Delete");
        });
      });
    }
    render();
  };

          kpi("Total trips", t.count) +
          kpi("Passengers transported", t.passengers) +
          kpi("Passenger requests", c.totalRequests) +
          kpi("Fulfilment rate", u.servedRate + "%", u.servedRate < 70 ? "warn" : "", u.served + " of " + u.total + " requests served") +
          kpi("Average waiting time", w.avg != null ? PARA.fmt.mins(w.avg) : "no samples", w.avg > 15 ? "warn" : "", w.count + " samples") +
          kpi("Median wait", w.median != null ? PARA.fmt.mins(w.median) : "—") +
          kpi("Longest recorded wait", w.max != null ? PARA.fmt.mins(w.max) : "—", w.max > 25 ? "warn" : "") +
          kpi("Average travel time", tr.avg != null ? PARA.fmt.mins(tr.avg) : "—", tr.avg > 8 ? "warn" : "", tr.count + " segment records") +
          kpi("Delays recorded", d.count, d.count ? "warn" : "", d.avgDelay != null ? "avg " + PARA.fmt.mins(d.avgDelay) : "") +
          kpi("Busiest hour", peak.busiest && peak.busiest.requests ? (peak.busiest.hour < 10 ? "0" : "") + peak.busiest.hour + ":00" : "no data", "") +
          kpi("Average passengers/trip", t.avgPax != null ? Math.round(t.avgPax) : "—") +
          kpi("Capacity utilisation", c.avgUtilization != null ? Math.round(c.avgUtilization) + "%" : "not measurable", c.avgUtilization > 90 ? "warn" : "", "against seats offered") +
        "</div>" +

        "<div class='grid g2'>" +
          hourlyChart(PARA.analytics.demandByHour(r), "requests", "Passenger demand by hour") +
          hourlyChart(PARA.analytics.demandByHour(r), "passengers", "Passengers transported by trip start hour") +
        "</div>" +

        "<div class='card'><div class='card-head'><h3>Peak and low demand detection</h3>" +
          "<span class='card-note'>based on " + r.label.toLowerCase() + "</span></div>" +
          "<div class='grid g4'>" +
            kpi("Morning (05–10)", peak.morning) +
            kpi("Midday (10–15)", peak.midday) +
            kpi("Evening (15–21)", peak.evening) +
            kpi("School-hour cluster", peak.schoolPeak, peak.schoolPeak > 4 ? "warn" : "", "07:00 and 15:00–17:00") +
          "</div>" +
          "<div class='alert info' style='margin-top:14px'>Busiest recorded hour: <strong>" +
            (peak.busiest && peak.busiest.requests ? (peak.busiest.hour < 10 ? "0" : "") + peak.busiest.hour + ":00–" + ((peak.busiest.hour + 1) < 10 ? "0" : "") + (peak.busiest.hour + 1) + ":00 with " + peak.busiest.requests + " requests" : "not enough data") +
          "</strong>. Quietest recorded hour: <strong>" +
            (peak.quietest ? (peak.quietest.hour < 10 ? "0" : "") + peak.quietest.hour + ":00 with " + peak.quietest.requests + " requests" : "n/a") + "</strong>.</div>" +
        "</div>" +

        "<div class='card pad-0'><div class='card-head' style='padding:16px 18px 0'><h3>Demand, waiting and fulfilment by stop</h3></div>" +
          "<div class='table-wrap'><table class='t'><thead><tr><th>Stop</th><th class='num'>Requests</th><th class='num'>As origin</th><th class='num'>As destination</th>" +
          "<th class='num'>Avg wait</th><th class='num'>Longest wait</th><th class='num'>Wait samples</th><th class='num'>Destination fulfilled</th></tr></thead><tbody>" +
          stops.map(function (s) {
            return "<tr><td><strong>" + PARA.esc(s.stop.name) + "</strong><div class='stop-meta'>" + PARA.esc(s.stop.code) + "</div></td>" +
              "<td class='num'>" + s.requests + "</td><td class='num'>" + s.asOrigin + "</td><td class='num'>" + s.asDest + "</td>" +
              "<td class='num'>" + (s.avgWait != null ? PARA.fmt.mins(s.avgWait) : "—") + "</td>" +
              "<td class='num'>" + (s.maxWait != null ? PARA.fmt.mins(s.maxWait) : "—") + "</td>" +
              "<td class='num'>" + s.waitSamples + "</td>" +
              "<td class='num'>" + (s.fulfilled != null ? s.fulfilled + "%" : "—") + "</td></tr>";
          }).join("") + "</tbody></table></div></div>" +

        "<div class='grid g2'>" +
          "<div class='card pad-0'><div class='card-head' style='padding:16px 18px 0'><h3>Demand vs available capacity by hour</h3></div>" +
            "<div class='table-wrap'><table class='t'><thead><tr><th>Hour</th><th class='num'>Requests</th><th class='num'>Seats offered</th><th class='num'>Utilisation</th><th>Pressure</th></tr></thead><tbody>" +
            c.rows.map(function (row) {
              if (!row.requests && !row.capacity) return "";
              var color = row.pressure === "over" ? "over" : row.pressure === "high" ? "hot" : "";
              return "<tr><td>" + (row.hour < 10 ? "0" : "") + row.hour + ":00</td>" +
                "<td class='num'>" + row.requests + "</td><td class='num'>" + (row.capacity || "—") + "</td>" +
                "<td class='num' style='min-width:110px'><div class='meter'><i class='" + color + "' style='width:" + Math.min(100, row.utilization || 0) + "%'></i></div>" +
                  "<span class='stop-meta'>" + (row.utilization != null ? row.utilization + "%" : "no trips") + "</span></td>" +
                "<td>" + (row.capacity ? PARA.tag(row.pressure, PARA.titleize(row.pressure) + " pressure") : "<span class='card-note'>no service</span>") + "</td></tr>";
            }).join("") + "</tbody></table></div>" +
            "<div style='padding:14px 18px'>" +
              "<div class='alert warn'>Where requests exceed the seats offered in the same hour, PARA records this as <strong>capacity pressure</strong>, not as a conclusion that the service is inadequate. Other passengers may have travelled outside the recorded hours or used other means.</div>" +
              "<div class='card-note'>Fleet capacity currently in service: " + c.fleetCapacity + " seats.</div>" +
            "</div>" +
          "</div>" +
          "<div class='card'><div class='card-head'><h3>Demand by time-sensitivity</h3><span class='card-note'>50 requests are not equal — urgency matters</span></div>" +
            sens.map(function (s) {
              return "<div style='margin-bottom:12px'><div style='display:flex;justify-content:space-between;font-size:13.5px'><strong>" + PARA.esc(s.label) + "</strong>" +
                "<span>" + s.count + " request" + (s.count === 1 ? "" : "s") + " · " + (s.count ? Math.round((s.served / s.count) * 100) : 0) + "% served</span></div>" +
                "<div class='meter' style='margin-top:5px'><i style='width:" + (s.count ? Math.round((s.count / Math.max(1, c.totalRequests)) * 100) : 0) + "%'></i></div></div>";
            }).join("") +
            "<div class='card-head' style='margin-top:20px'><h3>Requests that were not fulfilled</h3></div>" +
            (u.byStatus.length
              ? "<ul class='stop-list'>" + u.byStatus.map(function (s) {
                  return "<li><div class='stop-num'>" + s.count + "</div><div><strong>" + PARA.esc(PARA.CONST.requestLabel[s.status] || s.status) + "</strong>" +
                    "<div class='stop-meta'>" + (s.status === "used_other" ? "Passenger travelled another way — not a service failure." : s.status === "capacity_unavailable" ? "Vehicle was full at the time." : s.status === "missed_vehicle" ? "Vehicle left before the passenger boarded." : s.status === "service_unavailable" ? "No service was running at that time." : "Recorded outcome.") + "</div></div></li>";
                }).join("") + "</ul>"
              : "<div class='empty'>Every recorded request was served.</div>") +
            (u.mustNotServed ? "<div class='alert err'>" + u.mustNotServed + " request(s) marked <strong>Must Arrive By</strong> were not served. These deserve review first.</div>" : "") +
          "</div>" +
        "</div>" +

        "<div class='grid g2'>" +
          "<div class='card pad-0'><div class='card-head' style='padding:16px 18px 0'><h3>Travel time between stops</h3></div>" +
            "<div class='table-wrap'><table class='t'><thead><tr><th>Segment</th><th class='num'>Runs</th><th class='num'>Avg</th><th class='num'>Fastest</th><th class='num'>Slowest</th></tr></thead><tbody>" +
            (tr.segments.length ? tr.segments.map(function (s) {
              return "<tr><td>" + PARA.esc(s.fromName) + " → " + PARA.esc(s.toName) + "</td>" +
                "<td class='num'>" + s.count + "</td><td class='num'>" + PARA.esc(PARA.fmt.mins(s.avg)) + "</td>" +
                "<td class='num'>" + PARA.esc(PARA.fmt.mins(s.min)) + "</td><td class='num'>" + PARA.esc(PARA.fmt.mins(s.max)) + "</td></tr>";
            }).join("") : "<tr><td colspan='5'><div class='empty'>No completed segment records yet.</div></td></tr>") +
            "</tbody></table></div></div>" +
          "<div class='card'><div class='card-head'><h3>Delay analysis</h3></div>" +
            "<div class='grid g3' style='margin-bottom:14px'>" +
              kpi("Delay events", d.count) + kpi("Average delay", d.avgDelay != null ? PARA.fmt.mins(d.avgDelay) : "—") + kpi("Longest delay", d.maxDelay != null ? PARA.fmt.mins(d.maxDelay) : "—") +
            "</div>" +
            "<div class='card-note' style='margin-bottom:6px'>Reasons given</div>" +
            (d.reasons.length ? "<ul class='stop-list'>" + d.reasons.map(function (r) {
              return "<li><div class='stop-num'>" + r.count + "</div><div><strong>" + PARA.esc(PARA.CONST.delayLabel[r.reason] || r.reason) + "</strong></div></li>";
            }).join("") + "</ul>" : "<div class='empty'>No delay reasons recorded.</div>") +
            (d.hotspots.length ? "<div class='card-note' style='margin:14px 0 6px'>Where delays are recorded most often</div>" +
              "<ul class='stop-list'>" + d.hotspots.map(function (h) {
                return "<li><div class='stop-num'>" + h.count + "</div><div><strong>" + PARA.esc(h.stopName) + "</strong></div></li>";
              }).join("") + "</ul>" : "") +
            "<div class='alert info' style='margin-top:12px'>These are vehicle-level observations along the route. PARA does not claim to measure all community traffic.</div>" +
          "</div>" +
        "</div>" +

        "<div class='card'><div class='card-head'><h3>Waiting times</h3><span class='card-note'>from request time to actual vehicle arrival</span></div>" +
          "<div class='grid g4' style='margin-bottom:14px'>" +
            kpi("Average", w.avg != null ? PARA.fmt.mins(w.avg) : "—") +
            kpi("Median", w.median != null ? PARA.fmt.mins(w.median) : "—") +
            kpi("Maximum", w.max != null ? PARA.fmt.mins(w.max) : "—") +
            kpi("Minimum", w.min != null ? PARA.fmt.mins(w.min) : "—") +
          "</div>" +
          hourlyChart(w.byHour, "avg", "Average waiting time by hour") +
        "</div>" +

        "<div class='grid g2'>" +
          "<div class='card'><div class='card-head'><h3>Detected patterns</h3></div>" +
            (patterns.length ? "<ul class='stop-list'>" + patterns.map(function (p) {
              return "<li><div class='stop-num'>" + p.requests + "</div><div><strong>" + PARA.esc(p.label) + "</strong>" +
                "<div class='stop-meta'>" + p.requests + " requests · " + p.passengers + " passengers carried · " + p.trips + " trips</div>" +
                "<div class='stop-meta'>" + PARA.esc(p.note) + "</div></div></li>";
            }).join("") + "</ul>" : "<div class='empty'>Not enough recorded data to detect patterns yet.</div>") +
          "</div>" +
          "<div class='card'><div class='card-head'><h3>Relationships between measures</h3></div>" +
            (corr.length ? corr.map(function (c) {
              return "<div style='padding:10px 0;border-bottom:1px solid #dfe6e0'>" +
                "<strong style='font-size:13.5px'>" + PARA.esc(c.a) + (c.r != null ? " <span class='tag " + (c.r > 0.3 ? "t-amber" : "t-blue") + "'>r = " + c.r + "</span>" : "") + "</strong>" +
                "<div class='stop-meta'>" + PARA.esc(c.reading) + "</div></div>";
            }).join("") : "<div class='empty'>Not enough overlapping data to compare measures yet.</div>") +
          "</div>" +
        "</div>" +

        "<div class='card pad-0'><div class='card-head' style='padding:16px 18px 0'><h3>Weekly trend (8 weeks)</h3></div>" +
          "<div class='table-wrap'><table class='t'><thead><tr><th>Week</th><th class='num'>Trips</th><th class='num'>Passengers</th><th class='num'>Requests</th>" +
          "<th class='num'>Avg wait</th><th class='num'>Avg trip</th><th class='num'>Delays</th></tr></thead><tbody>" +
          trend.map(function (x) {
            return "<tr><td>" + PARA.esc(x.label) + "</td><td class='num'>" + x.trips + "</td><td class='num'>" + x.passengers + "</td>" +
              "<td class='num'>" + x.requests + "</td><td class='num'>" + (x.avgWait != null ? PARA.fmt.mins(x.avgWait) : "—") + "</td>" +
              "<td class='num'>" + (x.avgDuration != null ? PARA.fmt.mins(x.avgDuration) : "—") + "</td><td class='num'>" + x.delays + "</td></tr>";
          }).join("") + "</tbody></table></div></div>" +

        "<div class='card'><div class='card-head'><h3>Data quality</h3><span class='card-note'>" + flags.length + " item(s) flagged — these are not treated as verified facts</span></div>" +
          (flags.length ? "<ul class='stop-list'>" + flags.map(function (f) {
            return "<li><div class='stop-num'>" + (f.severity === "high" ? "!" : f.severity === "medium" ? "?" : "i") + "</div><div>" +
              "<strong>" + PARA.esc(f.kind) + " — " + PARA.esc(f.subject) + "</strong><div class='stop-meta'>" + PARA.esc(f.detail) + "</div></div></li>";
          }).join("") + "</ul>" : "<div class='alert ok'>No data-quality problems detected in this period.</div>") +
        "</div>";

      root.querySelectorAll("[data-range]").forEach(function (b) {
        b.addEventListener("click", function () {
          rangeId = b.getAttribute("data-range");
          sessionStorage.setItem("para_range", rangeId);
          render();
        });
      });

      root.querySelector("#export-all").addEventListener("click", exportAll);
      root.querySelector("#build-report").addEventListener("click", buildReport);
    }

    function exportAll() {
      var db = PARA.store.db;
      var stopName = function (id) { var s = db.stops.filter(function (x) { return x.id === id; })[0]; return s ? s.name : ""; };
      var driverName = function (id) { var d = db.drivers.filter(function (x) { return x.id === id; })[0]; return d ? d.fullName : ""; };
      var vehicleName = function (id) { var v = db.vehicles.filter(function (x) { return x.id === id; })[0]; return v ? v.name : ""; };

      PARA.ui.modal({
        title: "Export data",
        body: "<div class='alert info'>Each dataset is exported as its own CSV file.</div>" +
          "<div class='pill-row' style='margin-top:10px'>" +
            ["Trips", "Vehicles", "Drivers", "Stops", "Passenger requests", "Passenger counts", "Waiting times", "Travel times", "Delays", "Incidents", "Reports", "GPS positions", "Demand summary"].map(function (k) {
              return "<button class='btn ghost sm' data-exp='" + PARA.esc(k) + "'>" + PARA.esc(k) + "</button>";
            }).join("") + "</div>",
        footer: false,
        onMount: function (box) {
          box.querySelectorAll("[data-exp]").forEach(function (b) {
            b.addEventListener("click", function () {
              var kind = b.getAttribute("data-exp");
              if (kind === "Trips") {
                PARA.analytics.exportCsv("para_trips.csv", ["Trip", "Driver", "Vehicle", "Started", "Ended", "Duration (min)", "Passengers", "Capacity", "Delay (min)", "Delay reason", "Status"],
                  db.trips.map(function (t) { return [t.code, driverName(t.driverId), vehicleName(t.vehicleId), t.startAt, t.endAt || "", t.durationMin || "", t.passengers, t.capacityAtTime || "", t.delayMin || "", t.delayReason || "", t.status]; }));
              } else if (kind === "Vehicles") {
                PARA.analytics.exportCsv("para_vehicles.csv", ["Code", "Name", "Type", "Capacity", "Plate", "Status", "GPS status", "Driver", "Last GPS"],
                  db.vehicles.map(function (v) { return [v.code, v.name, v.type, v.capacity, v.plate, v.status, PARA.geo.gpsFreshness(v), driverName(v.driverId), v.lastGpsAt || ""]; }));
              } else if (kind === "Drivers") {
                PARA.analytics.exportCsv("para_drivers.csv", ["Driver ID", "Name", "Contact", "License", "Status", "Activation", "Vehicle", "Registered"],
                  db.drivers.map(function (d) { return [d.code, d.fullName, d.contact, d.license, d.status, d.activation, vehicleName(d.vehicleId), d.registeredAt]; }));
              } else if (kind === "Stops") {
                PARA.analytics.exportCsv("para_stops.csv", ["Code", "Name", "Location", "Latitude", "Longitude", "Position", "From prev (min)", "To next (min)"],
                  db.stops.map(function (s) { return [s.code, s.name, s.location, s.lat, s.lng, s.position, s.travelFromPrev, s.travelToNext]; }));
              } else if (kind === "Passenger requests") {
                PARA.analytics.exportCsv("para_passenger_requests.csv", ["Request", "Date", "Desired time", "Sensitivity", "Origin", "Destination", "Status", "Created"],
                  db.requests.map(function (q) { return [q.code, q.date, q.desiredTime, q.sensitivity, stopName(q.originId), stopName(q.destId), q.status, q.createdAt]; }));
              } else if (kind === "Passenger counts") {
                PARA.analytics.exportCsv("para_passenger_counts.csv", ["Trip", "Vehicle", "Passengers", "Capacity", "Utilisation %", "Recorded"],
                  db.trips.filter(function (t) { return t.status === "completed"; }).map(function (t) {
                    return [t.code, vehicleName(t.vehicleId), t.passengers, t.capacityAtTime, t.capacityAtTime ? Math.round((t.passengers / t.capacityAtTime) * 100) : "", t.endAt];
                  }));
              } else if (kind === "Waiting times") {
                PARA.analytics.exportCsv("para_waiting_times.csv", ["Stop", "Requested at", "Expected", "Arrived", "Wait (min)"],
                  db.waitingTimes.map(function (w) { return [stopName(w.stopId), w.requestedAt, w.expectedAt, w.arrivedAt, w.waitMin]; }));
              } else if (kind === "Travel times") {
                PARA.analytics.exportCsv("para_travel_times.csv", ["From", "To", "Started", "Ended", "Minutes"],
                  db.travelTimes.map(function (t) { return [stopName(t.fromStopId), stopName(t.toStopId), t.startedAt, t.endedAt, t.minutes]; }));
              } else if (kind === "Delays") {
                PARA.analytics.exportCsv("para_delays.csv", ["Vehicle", "Driver", "Normal (min)", "Actual (min)", "Delay (min)", "Reason", "Detected", "Resolved", "Stop"],
                  db.delays.map(function (d) { return [vehicleName(d.vehicleId), driverName(d.driverId), d.normalMin, d.actualMin, d.delayMin, d.reason, d.detectedAt, d.resolvedAt || "", stopName(d.stopId)]; }));
              } else if (kind === "Incidents") {
                PARA.analytics.exportCsv("para_incidents.csv", ["ID", "When", "Reporter", "Type", "Category", "Location", "Description", "Status", "Resolution"],
                  db.incidents.map(function (i) { return [i.code, i.at, i.reporterType, i.reporterType, i.category, i.location, i.description, i.status, i.resolution]; }));
              } else if (kind === "Reports") {
                PARA.analytics.exportCsv("para_reports.csv", ["ID", "When", "From", "Type", "Location", "Description", "Status"],
                  db.reports.map(function (x) { return [x.code, x.at, x.reporterType, x.type, x.location, x.description, x.status]; }));
              } else if (kind === "GPS positions") {
                PARA.analytics.exportCsv("para_gps.csv", ["Vehicle", "Trip", "Latitude", "Longitude", "Speed kph", "Accuracy m", "Recorded"],
                  db.gps.slice(-2000).map(function (g) { return [vehicleName(g.vehicleId), g.tripId, g.lat, g.lng, g.speedKph || "", g.accuracyM || "", g.at]; }));
              } else if (kind === "Demand summary") {
                var r = PARA.analytics.range(rangeId);
                PARA.analytics.exportCsv("para_demand_by_hour.csv", ["Hour", "Requests", "Must arrive by", "Served", "Trips", "Passengers", "Seats offered", "Utilisation %"],
                  PARA.analytics.demandByHour(r).map(function (b) {
                    var cap = PARA.analytics.capacity(r).rows.filter(function (x) { return x.hour === b.hour; })[0];
                    return [(b.hour < 10 ? "0" : "") + b.hour + ":00", b.requests, b.must, b.served, b.trips, b.passengers, cap ? cap.capacity : 0, cap && cap.utilization != null ? cap.utilization : ""];
                  }));
              }
              PARA.ui.toast(kind + " exported", "good");
            });
          });
        }
      });
    }

    function buildReport() {
      var db = PARA.store.db;
      var r = PARA.analytics.range(rangeId);
      var t = PARA.analytics.tripStats(r), w = PARA.analytics.waitStats(r);
      var tr = PARA.analytics.travelStats(r), d = PARA.analytics.delayStats(r);
      var c = PARA.analytics.capacity(r), u = PARA.analytics.unmet(r);
      var peak = PARA.analytics.peak(r), today = PARA.analytics.dailySummary();
      var flags = PARA.analytics.dataQuality(r);

      var row = function (label, value) { return "<tr><td style='padding:6px 0'><strong>" + PARA.esc(label) + "</strong></td><td style='padding:6px 0;text-align:right'>" + value + "</td></tr>"; };

      PARA.ui.modal({
        wide: true,
        title: "Community transportation report — " + r.label,
        footer: false,
        body:
          "<div class='alert info'><strong>How to read this report.</strong> <em>Recorded facts</em> are values entered by drivers or passengers. " +
          "<em>Calculated statistics</em> are computed from those records. <em>System estimates</em> are projections such as ETAs. " +
          "<em>User-reported</em> items come from passenger or driver reports and are not independently verified.</div>" +
          "<h3 style='margin:18px 0 8px;font-size:15px'>1. Service activity (recorded facts)</h3>" +
          "<table class='t' style='border:1px solid #dfe6e0;border-radius:8px'>" +
            row("Trips recorded", t.count) +
            row("Passengers recorded as transported", t.passengers) +
            row("Trips completed", t.completed) +
            row("Passenger requests received", c.totalRequests) +
            row("Trips today", today.trips + " (" + today.passengers + " passengers)") +
          "</table>" +
          "<h3 style='margin:18px 0 8px;font-size:15px'>2. Demand (calculated from recorded requests)</h3>" +
          "<table class='t' style='border:1px solid #dfe6e0;border-radius:8px'>" +
            row("Busiest recorded hour", peak.busiest && peak.busiest.requests ? (peak.busiest.hour < 10 ? "0" : "") + peak.busiest.hour + ":00 (" + peak.busiest.requests + " requests)" : "not enough data") +
            row("Quietest recorded hour", peak.quietest ? (peak.quietest.hour < 10 ? "0" : "") + peak.quietest.hour + ":00 (" + peak.quietest.requests + " requests)" : "n/a") +
            row("Morning / midday / evening", peak.morning + " / " + peak.midday + " / " + peak.evening) +
            row("Requests marked Must Arrive By", u.total ? Math.round((PARA.analytics.demandBySensitivity(r).filter(function (s) { return s.key === "must_arrive_by"; })[0].count / u.total) * 100) + "% of requests" : "n/a") +
          "</table>" +
          "<h3 style='margin:18px 0 8px;font-size:15px'>3. Waiting and travel times (calculated)</h3>" +
          "<table class='t' style='border:1px solid #dfe6e0;border-radius:8px'>" +
            row("Average waiting time", w.avg != null ? PARA.fmt.mins(w.avg) + " (" + w.count + " samples)" : "no samples") +

              PARA.ui.field("What is happening?", "<select class='in' id='d-cat'>" +
                (s === "vehicle_problem"
                  ? ["Engine or transmission", "Brakes or tyres", "Door or interior", "Fuel or other", "Other"]
                  : ["Heavy traffic", "Road works", "Accident", "Flooding", "Road closure", "Passenger dispute", "Other"]
                ).map(function (o) { return "<option>" + PARA.esc(o) + "</option>"; }).join("") + "</select>") +
              PARA.ui.field("Description", "<textarea class='in' id='d-desc' placeholder='Briefly describe what is happening'></textarea>") +
              "<div class='row2'>" +
                PARA.ui.field("Delay added (minutes)", "<input class='in' type='number' id='d-delay' value='0' min='0'>") +

              "</div>" +
              "<div class='alert info'>This is recorded as a user report from the driver. It alerts passengers and appears in the incident review list.</div>",
            okText: "Save status",
            onOk: function (box) {
              var cat = box.querySelector("#d-cat").value;
              var extra = cat + (box.querySelector("#d-desc").value ? " — " + box.querySelector("#d-desc").value : "");
              var added = Number(box.querySelector("#d-delay").value) || 0;
              trip.delayMin = (trip.delayMin || 0) + added;
              trip.delayReason = s === "vehicle_problem" ? "vehicle_problem" : s === "road_problem" ? "road_obstruction" : (trip.delayReason || "passenger_loading");
              trip.statusDetail = extra;
              db.reports.unshift({
                id: PARA.store.uid("rpt"), code: "RPT-" + Math.random().toString(36).slice(2, 7).toUpperCase(),
                reporterType: "driver", reporterId: u.id, type: s === "vehicle_problem" ? "vehicle_problem" : s === "road_problem" ? "road_obstruction" : "other",
                location: (PARA.geo.nearestStop(trip.routeId, PARA.geo.tripCoord(trip)) || {}).stop?.name || "",
                at: new Date().toISOString(), description: extra, status: "open", tripId: trip.id
              });
              apply(extra);
            }
          });
        } else {
          apply(null);
        }
      });
    });

    var markBtn = root.querySelector("#mark-arrive");
    if (markBtn) {
      markBtn.addEventListener("click", function () {
        var trip = PARA.geo.activeTrips().filter(function (t) { return t.driverId === d.id; })[0];
        if (!trip) return;
        var stopId = root.querySelector("#arrive-stop").value;
        var stop = db.stops.filter(function (s) { return s.id === stopId; })[0];
        var now = new Date().toISOString();
        var fromId = trip.lastStopId || PARA.geo.stops(trip.routeId)[0].id;
        var fromStop = db.stops.filter(function (s) { return s.id === fromId; })[0];
        if (fromId === stopId) { PARA.ui.toast("That is already the last recorded stop"); return; }
        var startedAt = trip.lastStopAt || trip.startAt;
        var minutes = Math.max(1, Math.round((new Date(now) - new Date(startedAt)) / 60000));
        db.travelTimes.push({
          id: PARA.store.uid("tvt"), fromStopId: fromId, toStopId: stopId,
          startedAt: startedAt, endedAt: now, minutes: minutes, tripId: trip.id
        });
        trip.lastStopId = stopId;
        trip.lastStopAt = now;
        trip.progress = Math.max(trip.progress || 0, PARA.geo.stopFraction(stopId));
        PARa_record("record_stop_arrival", "trip", trip.id, stop.name + " after " + minutes + " min");
        PARA.store.save();
        PARA.ui.toast("Recorded " + minutes + " min to " + stop.name + " — this feeds the travel-time analysis", "good");
        PARA.render();
      });
    }

    var endBtn = root.querySelector("#end-trip");
    if (endBtn) {
      endBtn.addEventListener("click", function () {
        var trip = PARA.geo.activeTrips().filter(function (t) { return t.driverId === d.id; })[0];
        if (!trip) return;
        var paxRaw = root.querySelector("#end-pax").value;
        if (paxRaw === "" || Number(paxRaw) < 0) {
          root.querySelector("#end-err").innerHTML = "<div class='alert err'>Enter the number of passengers carried (use 0 if none).</div>";
          return;
        }
        var pax = Number(paxRaw);
        var veh = db.vehicles.filter(function (x) { return x.id === trip.vehicleId; })[0];
        if (veh && pax > veh.capacity) {
          root.querySelector("#end-err").innerHTML = "<div class='alert err'>" + pax + " passengers exceeds the " + veh.capacity + "-seat capacity recorded for this vehicle. Correct the number before ending the trip.</div>";
          return;
        }
        var end = new Date().toISOString();
        trip.endAt = end;
        trip.durationMin = Math.max(1, Math.round((new Date(end) - new Date(trip.startAt)) / 60000));
        trip.passengers = pax;
        trip.endLoc = root.querySelector("#end-loc").value || trip.startLoc;
        trip.delayReason = root.querySelector("#end-reason").value || trip.delayReason;
        trip.notes = root.querySelector("#end-notes").value || "";
        trip.status = "completed";
        trip.gpsStatus = "stopped";
        trip.progress = 1;
        if (veh) veh.status = "available";

        var fromId = trip.lastStopId || PARA.geo.stops(trip.routeId)[0].id;
        var lastStop = db.stops.slice().sort(function (a, b) { return a.position - b.position; }).pop();
        if (lastStop && fromId !== lastStop.id) {
          db.travelTimes.push({
            id: PARA.store.uid("tvt"), fromStopId: fromId, toStopId: lastStop.id,
            startedAt: trip.lastStopAt || trip.startAt, endedAt: end, minutes: Math.max(1, Math.round((new Date(end) - new Date(trip.lastStopAt || trip.startAt)) / 60000)), tripId: trip.id
          });
        }
        if (trip.delayMin > 0) {
          db.delays.unshift({
            id: PARA.store.uid("dly"), tripId: trip.id, vehicleId: trip.vehicleId, driverId: trip.driverId,
            normalMin: Math.max(1, trip.durationMin - trip.delayMin), actualMin: trip.durationMin, delayMin: trip.delayMin,
            reason: trip.delayReason || "unknown", detectedAt: trip.startAt, resolvedAt: end, status: "resolved", stopId: fromId
          });
        }
        PARa_record("end_trip", "trip", trip.id, "Ended " + trip.code + " · " + pax + " passengers · " + trip.durationMin + " min");
        PARA.store.save();
        PARA.ui.toast("Trip recorded. Thank you — the data is now part of the transport history.", "good");
        PARA.render();
      });
    }
  };

  function wireRequestForm(root, afterSave) {
    var db = PARA.store.db;
    var form = root.querySelector("#req-form");
    if (!form) return;
    if (sessionStorage.getItem("para_prefill")) {
      try {
        var pf = JSON.parse(sessionStorage.getItem("para_prefill"));
        sessionStorage.removeItem("para_prefill");
        if (pf.originId) form.querySelector("[name='origin']").value = pf.originId;
        if (pf.destId) form.querySelector("[name='dest']").value = pf.destId;
        if (pf.time) form.querySelector("[name='time']").value = pf.time;
      } catch (e) { }
    }
    form.addEventListener("submit", function (e) {
      e.preventDefault();
      var p = me();
      if (!p) { location.hash = "#/login"; return; }
      var f = new FormData(form);
      var origin = f.get("origin"), dest = f.get("dest");
      if (origin === dest) {
        root.querySelector("#req-err").innerHTML = "<div class='alert err'>Boarding stop and destination must be different.</div>";
        return;
      }
      var desired = f.get("date") + "T" + f.get("time") + ":00";
      var plan = PARA.analytics.planTrip(origin, dest, desired, f.get("sensitivity"));
      var req = {
        id: PARA.store.uid("req"), code: "REQ-" + Math.random().toString(36).slice(2, 7).toUpperCase(),
        passengerId: p.id, date: f.get("date"), desiredTime: desired, sensitivity: f.get("sensitivity"),
        originId: origin, destId: dest, tripId: null, status: "submitted",
        note: f.get("note") || "", createdAt: new Date().toISOString(), resolvedAt: null,
        suggestedLeave: plan.ok ? plan.recommendedLeave.toISOString() : null
      };
      db.requests.unshift(req);
      PARa_record("submit_passenger_request", "request", req.id, req.code + " " + PARA.CONST.sensitivityLabel[req.sensitivity]);

      PARA.ui.toast("Request " + req.code + " submitted", "good");
      if (afterSave) afterSave();

      "<h1 class='title'>Request transportation</h1>" +

/* --- assets/app.js --- */
window.PARA = window.PARA || {};

(function (P) {
  "use strict";

  var ROUTES = {
    "": { view: "home" },
    "#/": { view: "home" },
    "#/route": { view: "route" },
    "#/planner": { view: "planner" },
    "#/login": { view: "login" },
    "#/signup": { view: "signup" },
    "#/account": { view: "account", any: true },
    "#/admin": { view: "admin", role: "admin" },
    "#/admin/drivers": { view: "admin-drivers", role: "admin" },
    "#/admin/vehicles": { view: "admin-vehicles", role: "admin" },
    "#/admin/route": { view: "admin-route", role: "admin" },
    "#/admin/announcements": { view: "admin-announcements", role: "admin" },
    "#/admin/incidents": { view: "admin-incidents", role: "admin" },
    "#/admin/analytics": { view: "admin-analytics", role: "admin" },
    "#/admin/service": { view: "admin-service", role: "admin" },
    "#/admin/logs": { view: "admin-logs", role: "admin" },
    "#/admin/data": { view: "admin-data", role: "admin" },
    "#/driver": { view: "driver", role: "driver" },
    "#/driver/trips": { view: "driver-trips", role: "driver" },
    "#/driver/reports": { view: "driver-reports", role: "driver" },
    "#/passenger": { view: "passenger", role: "passenger" },
    "#/passenger/request-new": { view: "passenger-request-new", role: "passenger" },
    "#/passenger/requests": { view: "passenger-requests", role: "passenger" },
    "#/passenger/reports": { view: "passenger-reports", role: "passenger" },
    "#/passenger/alerts": { view: "passenger-alerts", role: "passenger" }
  };

  var LIVE_VIEWS = { home: 1, route: 1, passenger: 1, driver: 1, admin: 1 };

  function navLinks(u) {
    var here = location.hash || "#/";
    var link = function (href, label) {
      return "<a href='" + href + "'" + (here === href ? " class='on'" : "") + ">" + PARA.esc(label) + "</a>";
    };
    var out = link("#/", "Home") + link("#/route", "Route & stops") + link("#/planner", "Plan trip");
    if (!u) return out;
    if (u.role === "admin") {
      out += link("#/admin", "Overview") + link("#/admin/drivers", "Drivers") + link("#/admin/vehicles", "Vehicles") +
        link("#/admin/route", "Route plan") + link("#/admin/announcements", "Announcements") +
        link("#/admin/incidents", "Incidents") + link("#/admin/analytics", "Analytics") +
        link("#/admin/service", "Service status") + link("#/admin/logs", "Logs") + link("#/admin/data", "Data");
    } else if (u.role === "driver") {
      out += link("#/driver", "My day") + link("#/driver/trips", "Trip history") + link("#/driver/reports", "Report a problem");
    } else if (u.role === "passenger") {
      out += link("#/passenger", "Home") + link("#/passenger/request-new", "Request a ride") +
        link("#/passenger/requests", "My requests") + link("#/passenger/alerts", "Alerts") + link("#/passenger/reports", "Report a problem");
    }
    return out;
  }

  function shell(u) {
    var unread = 0;
    if (u) {
      unread = PARA.store.db.notifications.filter(function (n) { return n.to === u.id && !n.read; }).length;
    }
    return "" +
      "<header class='topbar" + (u ? " has-user" : "") + "'><div class='topbar-inner'>" +
        "<a class='brand' href='#/'>" + PARA.logo(42) +
          "<span class='brand-text'><span class='brand-name'>PARA</span><span class='brand-sub'>Passenger Alert and Routing Assistant</span></span>" +
        "</a>" +
        "<nav class='nav' aria-label='Main navigation'>" + navLinks(u) + "</nav>" +
        "<div class='topbar-right'>" +
          (u
            ? "<div class='who'><b>" + PARA.esc(u.fullName) + "</b><span>" + PARA.esc(u.role) + "</span></div>" +
              (u.role === "passenger" && unread ? "<a class='btn white sm' href='#/passenger/alerts'>" + unread + " alert" + (unread === 1 ? "" : "s") + "</a>" : "") +
              "<a class='btn outline sm' href='#/account'>Account</a>" +
              "<button class='btn white sm' id='logout'>Sign out</button>"
            : "<a class='btn white sm' href='#/login'>Sign in</a>") +
        "</div>" +
      "</div></header>";
  }

  P.render = function () {
    var app = document.getElementById("app");
    if (!app) return;
    if (!P.store.db) P.store.load();
    P.geo.refreshStopEtas();

    var u = P.auth.user();
    var hash = location.hash || "#/";
    var route = ROUTES[hash];

    if (!route) {
      hash = u ? (u.role === "admin" ? "#/admin" : u.role === "driver" ? "#/driver" : "#/passenger") : "#/";
      location.hash = hash;
      route = ROUTES[hash] || ROUTES["#/"];
    }

    if (route.role && (!u || u.role !== route.role)) {
      P.ui.toast("That area is only available to " + route.role + " accounts", "bad");
      hash = u ? (u.role === "admin" ? "#/admin" : u.role === "driver" ? "#/driver" : "#/passenger") : "#/login";
      location.hash = hash;
      route = ROUTES[hash] || ROUTES["#/login"] || ROUTES["#/"];
    }
    if (route.any && !u) {
      hash = "#/login";
      location.hash = hash;
      route = ROUTES[hash] || ROUTES["#/"];
    }

    app.innerHTML = shell(u) + "<main class='main'><div id='view'></div></main>" +
      "<footer class='footer'>PARA · Passenger Alert and Routing Assistant · Community Transportation Intelligence and Assistance<br>" +
      "<span style='font-size:12px'>All data shown in this installation is stored locally in your browser. Arrival times are estimates, not guarantees.</span></footer>";

    var view = document.getElementById("view");
    var fn = P.views[route.view];
    if (typeof fn !== "function") {
      view.innerHTML = "<div class='card'><div class='empty'>This page is not available.</div></div>";
      return;
    }
    fn(view);

    var logout = document.getElementById("logout");
    if (logout) {
      logout.addEventListener("click", function () {
        P.auth.logout();
        P.store.save();
        P.ui.toast("Signed out");
        location.hash = "#/";
        P.render();
      });
    }

    document.title = "PARA — Passenger Alert and Routing Assistant";
  };

  P.onSimAlert = function (alerts) {
    var db = P.store.db;
    var u = P.auth.user();
    alerts.forEach(function (a) {
      if (a.longRun) {
        P.log.broadcast({ type: "delay", title: "A trip has been running unusually long", body: "One vehicle has been on the road for more than four hours. The administrator has been notified by the data-quality flag.", priority: "normal" });
        if (u && u.role === "admin") P.ui.toast("Data flag: a trip has been active for over 4 hours", "bad");
        return;
      }
      var veh = db.vehicles.filter(function (v) { return v.id === a.vehicleId; })[0];
      P.log.broadcast({
        type: "delay",
        title: "Delays on the main route",
        body: (veh ? veh.name + " is" : "A vehicle is") + " running about " + (a.delayMin || 0) + " minutes late" +
          (a.delayReason ? " (" + P.CONST.delayLabel[a.delayReason] + ")" : "") + ". Consider leaving a little earlier.",
        priority: (a.delayMin || 0) > 15 ? "high" : "normal"
      });
      if (u && u.role === "admin") P.ui.toast("Delay detected: " + (veh ? veh.name : "vehicle") + " +" + (a.delayMin || 0) + " min");
    });
  };

  P.boot = function () {
    P.store.load();
    P.geo.refreshStopEtas();
    P.sim.start();

    window.addEventListener("hashchange", function () { P.render(); });
    P.render();

    var tick = setInterval(function () {
      if (document.hidden) return;
      var hash = location.hash || "#/";
      var route = ROUTES[hash];
      if (!route || !LIVE_VIEWS[route.view]) return;
      var active = document.activeElement;
      if (active && /^(INPUT|SELECT|TEXTAREA)$/.test(active.tagName)) return;
      P.render();
    }, 10000);
    window.addEventListener("beforeunload", function () { P.store.save(); });
  };

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", function () { P.boot(); });
  } else {
    P.boot();
  }
})(PARA);

/*
 * Small keyword retriever. Scores every note against the question and
 * returns the best matches, so only relevant notes are sent to the model.
 */
PARA.kbRetrieve = function (query, k, pageId) {
  var STOP = {};
  ("a an and are as at be but by can could did do does for from had has have how i if in into is it its me my no not of on or our " +
   "should so tell than that the their them then there these they this to up us was we were what when where which who why will with " +
   "would you your please").split(" ").forEach(function (w) { STOP[w] = 1; });

  function tokens(s) {
    return String(s || "").toLowerCase().replace(/[^a-z0-9]+/g, " ").split(" ").filter(function (t) {
      return t && t.length > 1 && !STOP[t];
    });
  }

  function matches(qt, dt) {
    if (qt === dt) return 2;
    if (qt.length >= 4 && dt.length >= 4 && (qt.indexOf(dt) === 0 || dt.indexOf(qt) === 0)) return 1;
    return 0;
  }

  var q = tokens(query);
  var qPhrase = " " + tokens(query).join(" ") + " ";
  var scored = PARA.KB.map(function (doc) {
    var title = tokens(doc.title), tags = tokens(doc.tags), text = tokens(doc.text);
    var score = 0;

    q.forEach(function (qt) {
      var i;
      for (i = 0; i < title.length; i++) score += 4 * matches(qt, title[i]);
      for (i = 0; i < tags.length; i++) score += 4 * matches(qt, tags[i]);
      var inText = 0;
      for (i = 0; i < text.length && inText < 4; i++) if (matches(qt, text[i]) > 0) inText++;
      score += inText;
    });

    if (qPhrase.length > 4) {
      var t = " " + title.join(" ") + " " + tags.join(" ") + " ";
      if (t.indexOf(qPhrase) !== -1) score += 6;
      if ((" " + text.join(" ") + " ").indexOf(qPhrase) !== -1) score += 3;
    }
    if (pageId && doc.id === pageId) score += 4;
    return { doc: doc, score: score };
  });

  var hits = scored.filter(function (s) { return s.score > 0; })
    .sort(function (a, b) { return b.score - a.score; })
    .slice(0, k || 4)
    .map(function (s) { return s.doc; });

  if (!hits.length) {
    hits = PARA.KB.filter(function (d) { return d.id === "overview" || d.id === "assistant-help"; });
  } else if (!hits.some(function (d) { return d.id === "overview"; })) {
    hits.push(PARA.KB.filter(function (d) { return d.id === "overview"; })[0]);
  }
  return hits;
};

/* Which knowledge note fits the page the visitor is on right now. */
PARA.kbPageDoc = function (hash) {
  var h = String(hash || "");
  if (/^#\/admin/.test(h)) return "admin-features";
  if (/^#\/driver/.test(h)) return "driver-features";
  if (/^#\/passenger/.test(h)) return "passenger-features";
  if (h === "#/route") return "route-stops";
  if (h === "#/planner") return "trip-planner";
  if (h === "#/login" || h === "#/signup" || h === "#/account") return "accounts-login";
  return "overview";
};

            "<svg viewBox='0 0 24 24' width='19' height='19' aria-hidden='true'><path fill='currentColor' d='M3 20l18-8L3 4v6l12 2-12 2z'/></svg>" +
          "</button>" +
        "</form>" +
        "<div class='as-foot'>Retrieval-augmented answers from NVIDIA NIM · AI can make mistakes</div>" +
      "</section>";

    document.body.appendChild(wrap);

    $("as-fab").addEventListener("click", toggle);
    $("as-close").addEventListener("click", close);
    $("as-clear").addEventListener("click", clear);

    $("as-form").addEventListener("submit", function (e) {
      e.preventDefault();
      var input = $("as-input");
      var value = input ? input.value : "";
      if (!value.trim()) return;
      input.value = "";
      autoGrow(input);
      ask(value);
    });

    var input = $("as-input");
    input.addEventListener("keydown", function (e) {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        $("as-form").dispatchEvent(new Event("submit", { cancelable: true }));
      }
    });
    input.addEventListener("input", function () { autoGrow(input); });

    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape" && state.open) close();
    });

    renderMessages();

    if (/(^|[?&])assistant=open(&|$)/.test(location.search)) open();
  }

  function autoGrow(area) {
    if (!area) return;
    area.style.height = "auto";
    area.style.height = Math.min(area.scrollHeight, 132) + "px";
  }

  P.assistant = {
    __mounted: true,
    open: open,
    close: close,
    toggle: toggle,
    ask: ask,
    clear: clear,
    isOpen: function () { return state.open; },
    history: function () { return state.messages.slice(); },
    kbRetrieve: function (q) { return P.kbRetrieve(q, 4, P.kbPageDoc(location.hash)); }
  };

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", mount);
  } else {
    mount();
  }
})(PARA);


</script>
</body>
</html>
