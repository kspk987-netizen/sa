<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PARA — Passenger Alert and Routing Assistant</title>
<meta name="description" content="PARA is a community transportation assistance and intelligence system: live vehicle tracking, passenger alerts, routing help, and transport data analysis." />
<meta name="theme-color" content="#1b5e20" />
<style>
:root {
  --green-900: #0f3d1e;
  --green-700: #1b5e20;
  --green-600: #2e7d32;
  --green-500: #43a047;
  --green-400: #66bb6a;
  --green-100: #e8f5e9;
  --amber: #f9a825;
  --red: #d93025;
  --blue: #1a73e8;
  --ink: #16211a;
  --muted: #5f6b62;
  --line: #dfe6e0;
  --bg: #f4f7f4;
  --card: #ffffff;
  --shadow: 0 1px 3px rgba(16, 40, 24, .08), 0 8px 24px rgba(16, 40, 24, .06);
  --radius: 14px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body { height: 100%; }

body {
  font-family: "Segoe UI", system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif;
  background: var(--bg);
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
}

a { color: inherit; text-decoration: none; }

button, input, select, textarea { font: inherit; color: inherit; }

.app { min-height: 100%; display: flex; flex-direction: column; }

.topbar {
  position: sticky; top: 0; z-index: 40;
  background: linear-gradient(100deg, var(--green-800, #14532d), var(--green-600));
  color: #fff;
  box-shadow: 0 2px 14px rgba(0, 0, 0, .18);
}

.topbar-inner {
  max-width: 1240px; margin: 0 auto; padding: 10px 20px;
  display: flex; align-items: center; gap: 8px 16px; flex-wrap: wrap;
}

.brand { display: flex; align-items: center; gap: 11px; cursor: pointer; min-width: 0; }
.brand img { width: 42px; height: 42px; flex: none; display: block; }
.brand-text { display: flex; flex-direction: column; min-width: 0; }
.brand-name { font-size: 21px; font-weight: 800; letter-spacing: .5px; line-height: 1.05; }
.brand-sub {
  font-size: 11px; opacity: .85; letter-spacing: .3px; margin-top: 3px; line-height: 1.2;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}

.nav { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; margin-left: 8px; min-width: 0; }
.nav a {
  padding: 8px 13px; border-radius: 9px; font-size: 14px; font-weight: 500;
  color: rgba(255, 255, 255, .88); white-space: nowrap;
}
.nav a:hover { background: rgba(255, 255, 255, .14); }
.nav a.on { background: rgba(255, 255, 255, .22); font-weight: 700; }

.topbar-right { margin-left: auto; display: flex; align-items: center; gap: 8px 10px; flex-wrap: wrap; justify-content: flex-end; min-width: 0; }
.who { font-size: 13px; text-align: right; line-height: 1.3; min-width: 0; }
.who b { display: block; font-size: 14px; max-width: 190px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.who span { display: block; font-size: 12px; opacity: .8; text-transform: capitalize; }

/* Signed-in shell: identity row on top, navigation as its own full-width row */
.topbar.has-user .brand { order: 1; }
.topbar.has-user .topbar-right { order: 2; }
.topbar.has-user .nav {
  order: 3; flex: 1 0 100%; margin-left: 0; padding-top: 9px;
  border-top: 1px solid rgba(255, 255, 255, .16);
  flex-wrap: wrap; row-gap: 1px;
}
.topbar.has-user .nav a { padding: 7px 11px; font-size: 13.5px; }

.main { flex: 1; max-width: 1240px; width: 100%; margin: 0 auto; padding: 26px 20px 60px; }
.main.narrow { max-width: 520px; }

.footer {
  border-top: 1px solid var(--line); background: #fff;
  padding: 22px 20px; font-size: 13px; color: var(--muted); text-align: center;
}

h1.title { font-size: 27px; font-weight: 800; margin-bottom: 6px; }
h2.title { font-size: 21px; font-weight: 700; margin-bottom: 14px; }
.sub { color: var(--muted); font-size: 14px; margin-bottom: 20px; }
.section-gap { margin-top: 26px; }

.card {
  background: var(--card); border: 1px solid var(--line);
  border-radius: var(--radius); box-shadow: var(--shadow); padding: 20px; margin-bottom: 18px;
}
.card.pad-0 { padding: 0; overflow: hidden; }
.card-head {
  display: flex; align-items: center; justify-content: space-between;
  gap: 12px; flex-wrap: wrap; margin-bottom: 14px;
}
.card-head h3 { font-size: 16px; font-weight: 700; }
.card-note { font-size: 12.5px; color: var(--muted); }

.grid { display: grid; gap: 16px; }
.g2 { grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
.g3 { grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); }
.g4 { grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); }

.kpi { background: #fff; border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; box-shadow: var(--shadow); }
.kpi .v { font-size: 30px; font-weight: 800; color: var(--green-600); line-height: 1.1; }
.kpi .l { font-size: 13px; color: var(--muted); margin-top: 6px; }
.kpi.warn .v { color: var(--amber); }
.kpi.bad .v { color: var(--red); }

.hero {
  background: linear-gradient(120deg, var(--green-700), var(--green-500));
  color: #fff; border-radius: 18px; padding: 30px; box-shadow: var(--shadow);
  display: flex; gap: 28px; align-items: center; flex-wrap: wrap; margin-bottom: 22px;
}
.hero img { width: 96px; height: 96px; flex: none; }
.hero h1 { font-size: 27px; font-weight: 800; margin-bottom: 8px; }
.hero p { font-size: 14.5px; opacity: .95; max-width: 640px; }
.hero-actions { margin-top: 16px; display: flex; gap: 10px; flex-wrap: wrap; }

.btn {
  border: 0; cursor: pointer; border-radius: 10px; padding: 10px 16px;
  font-size: 14px; font-weight: 600; background: var(--green-600); color: #fff;
  display: inline-flex; align-items: center; gap: 7px; transition: filter .15s, transform .05s;
}
.btn:hover { filter: brightness(1.07); }
.btn:active { transform: translateY(1px); }
.btn.ghost { background: #eef3ef; color: var(--green-800, #14532d); }
.btn.ghost:hover { background: #e2ebe4; }
.btn.white { background: #fff; color: var(--green-700); }
.btn.outline { background: transparent; border: 1.5px solid rgba(255, 255, 255, .7); color: #fff; }
.btn.danger { background: var(--red); }
.btn.warn { background: var(--amber); color: #4a3200; }
.btn.sm { padding: 6px 11px; font-size: 12.5px; border-radius: 8px; }
.btn.block { width: 100%; justify-content: center; }
.btn:disabled { opacity: .5; cursor: not-allowed; }

.table-wrap { overflow-x: auto; }
table.t { width: 100%; border-collapse: collapse; font-size: 13.5px; }
table.t th {
  text-align: left; padding: 11px 14px; background: #f2f7f3; color: var(--muted);
  font-size: 11.5px; text-transform: uppercase; letter-spacing: .4px; font-weight: 700; white-space: nowrap;
}
table.t td { padding: 11px 14px; border-top: 1px solid var(--line); vertical-align: middle; }
table.t td:first-child { white-space: nowrap; }
table.t tbody tr:hover { background: #fafdfb; }
table.t td.num, table.t th.num { text-align: right; }
.empty { padding: 34px 16px; text-align: center; color: var(--muted); font-size: 14px; }

.tag {
  display: inline-block; padding: 3px 9px; border-radius: 999px;
  font-size: 11.5px; font-weight: 700; letter-spacing: .2px; white-space: nowrap;
}
.t-green { background: #e6f4ea; color: #14682c; }
.t-amber { background: #fef3d7; color: #8a5a00; }
.t-red { background: #fde7e5; color: #b3261e; }
.t-blue { background: #e6efff; color: #14509e; }
.t-grey { background: #eef1ee; color: #55605a; }

.pill-row { display: flex; gap: 8px; flex-wrap: wrap; }

.status-hero {
  display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  padding: 18px 20px; border-radius: var(--radius); border: 1px solid var(--line); background: #fff;
  box-shadow: var(--shadow); margin-bottom: 18px;
}
.status-dot { width: 14px; height: 14px; border-radius: 50%; flex: none; box-shadow: 0 0 0 5px rgba(0, 0, 0, .05); }
.dot-green { background: var(--green-500); }
.dot-amber { background: var(--amber); }
.dot-red { background: var(--red); }
.dot-grey { background: #9aa5a0; }
.status-hero .lbl { font-size: 19px; font-weight: 800; }
.status-hero .meta { font-size: 13px; color: var(--muted); }

form .field { margin-bottom: 14px; }
form label.lbl { display: block; font-size: 12.5px; font-weight: 700; color: var(--muted); margin-bottom: 5px; }
input.in, select.in, textarea.in {
  width: 100%; padding: 10px 12px; border: 1.5px solid var(--line);
  border-radius: 10px; background: #fff; outline: 0; font-size: 14px;
}
input.in:focus, select.in:focus, textarea.in:focus { border-color: var(--green-500); box-shadow: 0 0 0 3px rgba(67, 160, 71, .14); }
textarea.in { min-height: 88px; resize: vertical; }
.hint { font-size: 12px; color: var(--muted); margin-top: 5px; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
.chk { display: flex; align-items: center; gap: 8px; font-size: 13.5px; margin-bottom: 8px; }
.chk input { width: 16px; height: 16px; accent-color: var(--green-600); }

.alert { padding: 12px 14px; border-radius: 10px; font-size: 13.5px; margin-bottom: 14px; border: 1px solid; }
.alert.err { background: #fdecea; border-color: #f5c2bd; color: #a1160d; }
.alert.ok { background: #e7f6ea; border-color: #b7e3c1; color: #14682c; }
.alert.info { background: #e9f0ff; border-color: #c5d8fb; color: #16478f; }
.alert.warn { background: #fdf4e0; border-color: #f3ddab; color: #7a5200; }

.modal-bg {
  position: fixed; inset: 0; background: rgba(10, 25, 15, .55);
  display: flex; align-items: center; justify-content: center; padding: 18px; z-index: 90;
}
.modal {
  background: #fff; border-radius: 16px; width: 100%; max-width: 560px;
  max-height: 88vh; overflow: auto; box-shadow: 0 24px 60px rgba(0, 0, 0, .3);
}
.modal.wide { max-width: 820px; }
.modal-head {
  padding: 18px 20px; border-bottom: 1px solid var(--line);
  display: flex; align-items: center; justify-content: space-between;
  position: sticky; top: 0; background: #fff; border-radius: 16px 16px 0 0;
}
.modal-head h3 { font-size: 17px; font-weight: 700; }
.modal-body { padding: 20px; }
.modal-foot { padding: 14px 20px; border-top: 1px solid var(--line); display: flex; gap: 9px; justify-content: flex-end; }
.x { cursor: pointer; border: 0; background: #eef1ee; width: 30px; height: 30px; border-radius: 8px; font-size: 17px; line-height: 1; }

#toast-root { position: fixed; right: 18px; bottom: 92px; z-index: 120; display: flex; flex-direction: column; gap: 9px; }
.toast {
  background: #10241a; color: #fff; padding: 12px 16px; border-radius: 10px;
  font-size: 13.5px; box-shadow: 0 10px 30px rgba(0, 0, 0, .28); max-width: 330px;
  animation: pop .18s ease-out;
}
.toast.bad { background: #7f1d18; }
.toast.good { background: #14532d; }
@keyframes pop { from { transform: translateY(10px); opacity: 0; } to { transform: none; opacity: 1; } }

.map-wrap { position: relative; background: #f7fbf7; border-radius: 12px; border: 1px solid var(--line); overflow: hidden; }
.map-wrap svg { display: block; width: 100%; height: auto; }
.map-legend {
  display: flex; gap: 16px; flex-wrap: wrap; padding: 10px 12px; font-size: 12px;
  color: var(--muted); border-top: 1px solid var(--line); background: #fff;
}
.lg { display: flex; align-items: center; gap: 6px; }
.lg i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
.lg .bus { background: var(--green-600); }
.lg .stop { background: var(--amber); }
.lg .late { background: var(--red); }

.stop-list { list-style: none; }
.stop-list li {
  display: flex; gap: 12px; padding: 11px 0; border-bottom: 1px dashed var(--line); align-items: flex-start;
}
.stop-list li:last-child { border-bottom: 0; }
.stop-num {
  width: 26px; height: 26px; border-radius: 50%; flex: none; background: var(--green-100);
  color: var(--green-700); font-size: 12.5px; font-weight: 800;
  display: flex; align-items: center; justify-content: center;
}
.stop-meta { font-size: 12.5px; color: var(--muted); margin-top: 2px; }

.bars { display: flex; align-items: flex-end; gap: 6px; height: 168px; padding-top: 10px; }
.bar-col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; }
.bar {
  width: 100%; background: linear-gradient(180deg, var(--green-400), var(--green-600));
  border-radius: 6px 6px 0 0; min-height: 3px; position: relative;
}
.bar.peak { background: linear-gradient(180deg, #ffca6b, var(--amber)); }
.bar-val { font-size: 11.5px; font-weight: 700; }
.bar-lab { font-size: 10.5px; color: var(--muted); }

.meter { height: 9px; background: #edf2ee; border-radius: 999px; overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--green-500); }
.meter i.hot { background: var(--amber); }
.meter i.over { background: var(--red); }

.route-line { display: flex; gap: 0; align-items: center; flex-wrap: wrap; }
.route-line .seg { display: flex; align-items: center; }
.route-line .dotp { width: 11px; height: 11px; border-radius: 50%; background: var(--green-600); flex: none; }
.route-line .ln { height: 3px; width: 22px; background: var(--green-400); }
.route-line .nm { font-size: 12.5px; padding: 0 7px; white-space: nowrap; }

.plan-result {
  background: linear-gradient(120deg, #eef8f0, #ffffff); border: 1px solid #cfe6d5;
  border-radius: 12px; padding: 18px;
}
.plan-big { font-size: 26px; font-weight: 800; color: var(--green-700); }

.timeline { list-style: none; }
.timeline li { position: relative; padding: 0 0 16px 22px; border-left: 2px solid var(--line); }
.timeline li:last-child { border-left-color: transparent; padding-bottom: 0; }
.timeline li::before {
  content: ""; position: absolute; left: -7px; top: 3px; width: 12px; height: 12px;
  border-radius: 50%; background: var(--green-500); border: 2px solid #fff; box-shadow: 0 0 0 1px var(--line);
}
.timeline .t { font-size: 13.5px; font-weight: 700; }
.timeline .d { font-size: 12.5px; color: var(--muted); }

.login-card { background: #fff; border-radius: 18px; padding: 30px; box-shadow: var(--shadow); border: 1px solid var(--line); }
.login-logo { width: 78px; height: 78px; margin: 0 auto 12px; display: block; }
.demo-box { background: #f4f8f4; border: 1px dashed #c9ddcd; border-radius: 10px; padding: 13px; font-size: 12.5px; }
.demo-box code { background: #fff; padding: 1px 6px; border-radius: 5px; border: 1px solid var(--line); font-size: 12px; }
.demo-row { display: flex; justify-content: space-between; align-items: center; padding: 4px 0; gap: 8px; }

.notif { display: flex; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.notif:last-child { border-bottom: 0; }
.notif .ic { width: 34px; height: 34px; border-radius: 9px; flex: none; display: flex; align-items: center; justify-content: center; font-size: 16px; background: var(--green-100); }
.notif .t { font-size: 13.5px; font-weight: 700; }
.notif .m { font-size: 12.5px; color: var(--muted); }
.notif.unread { background: #f6fbf7; margin: 0 -8px; padding: 12px 8px; border-radius: 8px; }

.tabs { display: flex; gap: 6px; border-bottom: 1px solid var(--line); margin-bottom: 16px; flex-wrap: wrap; }
.tab {
  padding: 9px 14px; cursor: pointer; font-size: 14px; font-weight: 600; color: var(--muted);
  border-bottom: 2.5px solid transparent; margin-bottom: -1px;
}
.tab.on { color: var(--green-700); border-bottom-color: var(--green-600); }

.tabs-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }

.scroll-x { overflow-x: auto; }

@media (max-width: 860px) {
  .row2, .row3 { grid-template-columns: 1fr; }
  .topbar-inner { padding: 10px 14px; }
  .topbar:not(.has-user) .topbar-right { width: 100%; margin-left: 0; justify-content: flex-start; }
  .main { padding: 18px 14px 50px; }
  .hero { padding: 22px; }
  .hero img { width: 68px; height: 68px; }
  .brand-name { font-size: 18px; }
  .brand img { width: 36px; height: 36px; }
}

@media (max-width: 560px) {
  .brand-sub { display: none; }
  .who b { max-width: 130px; }
  .topbar-inner { gap: 6px 10px; }
  .topbar-right { gap: 6px 8px; }
  .topbar.has-user .nav {
    flex-wrap: nowrap; overflow-x: auto; overscroll-behavior-x: contain;
    scrollbar-width: none; -ms-overflow-style: none; padding-bottom: 1px;
  }
  .topbar.has-user .nav::-webkit-scrollbar { display: none; }
  .topbar.has-user .nav a { flex: none; padding: 7px 10px; font-size: 13px; }
}

/* ===================== PARA assistant (chat) ===================== */

/* Community bus photo used as a soft page backdrop, kept readable behind a wash */
body::before {
  content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
  background:
    linear-gradient(165deg, rgba(255, 255, 255, .86) 0%, rgba(238, 247, 240, .88) 55%, rgba(222, 239, 226, .93) 100%),
    url("istockphoto-1488597778-612x612.jpg") center / cover no-repeat;
}

#assistant-root { position: fixed; right: 20px; bottom: 20px; z-index: 85; font-family: inherit; }

#as-fab {
  position: relative; width: 58px; height: 58px; border-radius: 50%; border: 0; cursor: pointer; color: #fff;
  background: linear-gradient(135deg, var(--green-500), var(--green-700));
  box-shadow: 0 12px 28px rgba(15, 61, 30, .35), 0 2px 6px rgba(15, 61, 30, .2);
  display: flex; align-items: center; justify-content: center;
  transition: transform .15s, filter .15s;
}
#as-fab:hover { filter: brightness(1.08); transform: translateY(-1px); }
#as-fab:active { transform: translateY(0); }
#as-fab .as-dot {
  position: absolute; top: 2px; right: 2px; width: 12px; height: 12px; border-radius: 50%;
  background: var(--amber); border: 2px solid #fff; display: none;
}
#as-fab.as-pulse .as-dot { display: block; }
#as-fab.as-pulse::after {
  content: ""; position: absolute; inset: 0; border-radius: 50%;
  animation: as-ring 2.4s infinite;
}
@keyframes as-ring {
  0% { box-shadow: 0 0 0 0 rgba(67, 160, 71, .45); }
  70% { box-shadow: 0 0 0 17px rgba(67, 160, 71, 0); }
  100% { box-shadow: 0 0 0 0 rgba(67, 160, 71, 0); }
}

#as-panel {
  position: absolute; right: 0; bottom: 72px; width: 376px; max-width: calc(100vw - 32px);
  height: min(565px, 72vh); background: #fff; border: 1px solid var(--line); border-radius: 18px;
  overflow: hidden; display: flex; flex-direction: column;
  box-shadow: 0 24px 60px rgba(16, 40, 24, .28), 0 2px 8px rgba(16, 40, 24, .12);
  animation: as-in .18s ease-out;
}
#as-panel[hidden] { display: none; }
@keyframes as-in { from { opacity: 0; transform: translateY(10px) scale(.99); } to { opacity: 1; transform: none; } }

.as-head {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  padding: 12px 14px; color: #fff;
  background: linear-gradient(105deg, var(--green-800, #14532d), var(--green-600));
}
.as-id { display: flex; align-items: center; gap: 10px; min-width: 0; }
.as-avatar {
  width: 34px; height: 34px; flex: none; border-radius: 10px; background: rgba(255, 255, 255, .16);
  display: flex; align-items: center; justify-content: center;
}
.as-avatar svg { display: block; }
.as-title { font-size: 15px; font-weight: 800; line-height: 1.15; }
.as-sub { font-size: 11.5px; opacity: .85; }
.as-head-actions { display: flex; gap: 4px; }
.as-icon {
  border: 0; width: 30px; height: 30px; border-radius: 8px; cursor: pointer;
  background: rgba(255, 255, 255, .14); color: #fff;
  display: flex; align-items: center; justify-content: center;
}
.as-icon:hover { background: rgba(255, 255, 255, .28); }

#as-scroll { flex: 1; overflow-y: auto; overscroll-behavior: contain; background: #f7faf8; padding: 14px 12px 8px; }
#as-msgs { display: flex; flex-direction: column; gap: 12px; }
.as-msg { display: flex; flex-direction: column; max-width: 88%; }
.as-from-bot { align-self: flex-start; }
.as-from-user { align-self: flex-end; align-items: flex-end; }
.as-bubble {
  background: #fff; border: 1px solid var(--line); border-radius: 14px 14px 14px 4px;
  padding: 10px 13px; font-size: 13.5px; line-height: 1.5;
  box-shadow: 0 1px 2px rgba(16, 40, 24, .05); overflow-wrap: anywhere;
}
.as-user-bubble {
  background: var(--green-700); color: #fff; border-color: var(--green-700);
  border-radius: 14px 14px 4px 14px;
}
.as-bubble p { margin: 0 0 8px; }
.as-bubble p:last-child { margin-bottom: 0; }
.as-bubble ul, .as-bubble ol { margin: 6px 0 8px; padding-left: 18px; }
.as-bubble li { margin-bottom: 3px; }
.as-bubble code { background: #eef3ef; border: 1px solid var(--line); border-radius: 5px; padding: 0 5px; font-size: 12.5px; }
.as-user-bubble code { background: rgba(255, 255, 255, .18); border-color: transparent; }
.as-bubble a { color: var(--green-700); text-decoration: underline; }
.as-user-bubble a { color: #fff; }
.as-error { border-color: #f0b6b2; background: #fdf1f0; color: #8f1d15; }
.as-error .as-retry { margin-top: 8px; }
.as-time { font-size: 10.5px; color: var(--muted); margin: 4px 2px 0; }
.as-sources {
  display: flex; flex-wrap: wrap; align-items: center; gap: 5px;
  margin: 5px 2px 0; font-size: 11px; color: var(--muted);
}
.as-sources > span:first-child { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .4px; }
.as-source { background: #eef3ef; border: 1px solid var(--line); border-radius: 999px; padding: 1px 8px; font-size: 11px; }
.as-sugg { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.as-chip {
  border: 1px solid #cfe0d3; background: #fff; color: var(--green-800, #14532d);
  border-radius: 999px; padding: 6px 11px; font-size: 12px; font-weight: 600; cursor: pointer;
}
.as-chip:hover { background: var(--green-100); }
.as-typing { display: flex; align-items: center; gap: 5px; padding: 12px 14px; }
.as-typing i { width: 7px; height: 7px; border-radius: 50%; background: #9db8a4; animation: as-blink 1.1s infinite; }
.as-typing i:nth-child(2) { animation-delay: .15s; }
.as-typing i:nth-child(3) { animation-delay: .3s; }
@keyframes as-blink {
  0%, 60%, 100% { opacity: .35; transform: translateY(0); }
  30% { opacity: 1; transform: translateY(-2px); }
}

#as-form {
  display: flex; align-items: flex-end; gap: 8px;
  padding: 10px 12px 6px; border-top: 1px solid var(--line); background: #fff;
}
#as-input {
  flex: 1; resize: none; max-height: 132px; outline: 0;
  border: 1.5px solid var(--line); border-radius: 12px; padding: 9px 12px;
  font-size: 13.5px; line-height: 1.4; background: #fff;
}
#as-input:focus { border-color: var(--green-500); box-shadow: 0 0 0 3px rgba(67, 160, 71, .14); }
#as-input:disabled { background: #f4f6f4; }
#as-send {
  width: 40px; height: 40px; flex: none; border: 0; border-radius: 12px; cursor: pointer;
  background: var(--green-600); color: #fff;
  display: flex; align-items: center; justify-content: center;
}
#as-send:hover { filter: brightness(1.08); }
#as-send:disabled { opacity: .5; cursor: not-allowed; }
.as-foot { padding: 2px 12px 9px; font-size: 10.5px; color: var(--muted); text-align: center; background: #fff; }

@media (max-width: 560px) {
  #assistant-root { right: 14px; bottom: 14px; }
  #as-panel {
    position: fixed; inset: 0; width: auto; max-width: none; height: auto;
    border: 0; border-radius: 0;
  }
  .as-msg { max-width: 92%; }
  .as-foot { padding-bottom: calc(9px + env(safe-area-inset-bottom)); }
}

PARA.auth = {
  session: null,

  load: function () {
    var raw = null;
    try { raw = sessionStorage.getItem(PARA.KEY_SESSION); } catch (e) { }
    if (!raw) return null;
    try {
      var s = JSON.parse(raw);
      if (!s || !s.userId || !s.expiresAt || s.expiresAt < Date.now()) { this.clear(); return null; }
      return s;
    } catch (e) { this.clear(); return null; }
  },

  save: function (user) {
    this.session = { userId: user.id, role: user.role, at: new Date().toISOString(), expiresAt: Date.now() + PARA.SESSION_HOURS * 3600000 };
    try { sessionStorage.setItem(PARA.KEY_SESSION, JSON.stringify(this.session)); } catch (e) { }
  },

  clear: function () {
    this.session = null;
    try { sessionStorage.removeItem(PARA.KEY_SESSION); } catch (e) { }
  },

  login: function (username, password) {
    var u = PARa_findUser(username);
    if (!u) return { ok: false, error: "No account found with that username." };
    if (u.password !== password) return { ok: false, error: "Incorrect password." };
    if (!u.active) return { ok: false, error: "This account is deactivated. Contact the administrator." };
    if (!u.activated) return { ok: false, error: "This account has not been activated yet." };
    u.lastLoginAt = new Date().toISOString();
    PARa_record("login", "user", u.id, "Signed in");
    PARA.store.save();
    this.save(u);
    return { ok: true, user: u };
  },

  current: function () {
    if (this.session) return this.session;
    this.session = this.load();
    return this.session;
  },

  user: function () {
    var s = this.current();
    if (!s) return null;
    return PARA.store.db.users.filter(function (u) { return u.id === s.userId; })[0] || null;
  },

  logout: function () {
    var u = this.user();
    if (u) { PARa_record("logout", "user", u.id, "Signed out"); PARA.store.save(); }
    this.clear();
  },

  requireRole: function (role) {
    var u = this.user();
    return !!u && u.role === role;
  }
};

function PARa_findUser(username) {
  var needle = String(username || "").trim().toLowerCase();
  return PARA.store.db.users.filter(function (u) { return u.username.toLowerCase() === needle; })[0] || null;
}

PARA.log = {

      id: PARA.store.uid("act"), action: action, entity: entity, entityId: entityId || null,
      by: u ? u.id : null, byName: u ? u.fullName : "Public visitor", role: u ? u.role : "public",

    });

  },
  notify: function (opts) {

      id: PARA.store.uid("ntf"), to: opts.to, toType: opts.toType || "user",
      type: opts.type || "system", title: opts.title, body: opts.body || "",
      priority: opts.priority || "normal", read: false, at: new Date().toISOString()
    });

PARA.ui = {
  toast: function (msg, kind) {
    var root = document.getElementById("toast-root");
    if (!root) return;
    var el = document.createElement("div");
    el.className = "toast" + (kind ? " " + kind : "");
    el.textContent = msg;
    root.appendChild(el);
    setTimeout(function () {
      el.style.transition = "opacity .3s";
      el.style.opacity = "0";
      setTimeout(function () { el.remove(); }, 320);
    }, 3200);
  },

  modal: function (opts) {
    var root = document.getElementById("modal-root");
    root.innerHTML = "";
    var bg = document.createElement("div");
    bg.className = "modal-bg";
    var close = function () { root.innerHTML = ""; };
    bg.innerHTML =
      "<div class='modal" + (opts.wide ? " wide" : "") + "'>" +
        "<div class='modal-head'><h3>" + PARA.esc(opts.title) + "</h3><button class='x' data-close>&times;</button></div>" +
        "<div class='modal-body'>" + opts.body + "</div>" +
        (opts.footer === false ? "" : "<div class='modal-foot'>" +
          "<button class='btn ghost' data-close>Cancel</button>" +
          "<button class='btn' data-ok>" + PARA.esc(opts.okText || "Save") + "</button></div>") +
      "</div>";
    root.appendChild(bg);
    bg.addEventListener("click", function (e) {
      if (e.target === bg || e.target.hasAttribute("data-close")) close();
    });
    var okBtn = bg.querySelector("[data-ok]");
    if (okBtn) {
      okBtn.addEventListener("click", function () {
        if (opts.onOk) {
          var res = opts.onOk(bg);
          if (res === false) return;
        }
        close();
      });
    }
    if (opts.onMount) opts.onMount(bg, close);
    var first = bg.querySelector("input,select,textarea");
    if (first) setTimeout(function () { first.focus(); }, 40);
    return close;
  },

  confirm: function (title, message, onYes, okText) {
    return this.modal({
      title: title,
      body: "<p style='font-size:14px'>" + PARA.esc(message) + "</p>",
      okText: okText || "Confirm",

  options: function (list, selected, labeller) {

PARA.esc = function (s) {
  if (s == null) return "";
  return String(s).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
};

PARA.fmt = {
  time: function (iso) {
    if (!iso) return "—";
    var d = new Date(iso);
    return isNaN(d) ? "—" : d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
  },
  date: function (iso) {
    if (!iso) return "—";
    var d = new Date(iso);
    return isNaN(d) ? "—" : d.toLocaleDateString([], { year: "numeric", month: "short", day: "numeric" });
  },
  dateTime: function (iso) {
    if (!iso) return "—";
    var d = new Date(iso);
    return isNaN(d) ? "—" : d.toLocaleDateString([], { month: "short", day: "numeric" }) + " · " + d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
  },
  mins: function (m) {
    if (m == null) return "—";
    if (m < 60) return Math.round(m) + " min";
    var h = Math.floor(m / 60), r = Math.round(m % 60);
    return r ? h + "h " + r + "m" : h + "h";
  },
  ago: function (iso) {
    if (!iso) return "—";
    var diff = (Date.now() - new Date(iso).getTime()) / 1000;
    if (isNaN(diff)) return "—";
    if (diff < 60) return "just now";
    if (diff < 3600) return Math.floor(diff / 60) + " min ago";
    if (diff < 86400) return Math.floor(diff / 3600) + "h ago";
    return Math.floor(diff / 86400) + "d ago";
  },
  until: function (iso) {
    if (!iso) return "—";
    var diff = (new Date(iso).getTime() - Date.now()) / 1000;
    if (isNaN(diff)) return "—";
    if (diff <= 0) return "now";
    if (diff < 3600) return "in " + Math.floor(diff / 60) + " min";
    return "in " + Math.floor(diff / 3600) + "h";
  },
  dayLabel: function (iso) {
    if (!iso) return "—";
    return new Date(iso).toLocaleDateString([], { weekday: "short" });
  }
};

PARA.tagClass = function (value) {
  var g = String(value || "").toLowerCase();
  if (/(active|available|operating_normally|served|activated|resolved|completed|confirmed|ok|normal)/.test(g)) return "t-green";
  if (/(delayed|pending|under_review|investigating|open|assigned|temporarily|limited|delay|high)/.test(g)) return "t-amber";
  if (/(suspended|emergency|out_of_service|deactivated|missed|unavailable|cancelled|dismissed|critical|over)/.test(g)) return "t-red";
  if (/(blue|info|system|used_other|unknown)/.test(g)) return "t-blue";
  return "t-grey";
};

  return "<span class='tag " + PARA.tagClass(value) + "'>" + PARA.esc(label || PARA.enumLabel(value, value)) + "</span>";
};


/* --- assets/geo.js --- */
window.PARA = window.PARA || {};

PARA.geo = {
  EARTH_KM: 6371,

  haversine: function (a, b) {
    if (!a || !b) return 0;
    var toRad = function (d) { return d * Math.PI / 180; };
    var dLat = toRad(b.lat - a.lat), dLng = toRad(b.lng - a.lng);
    var s = Math.pow(Math.sin(dLat / 2), 2) +
      Math.cos(toRad(a.lat)) * Math.cos(toRad(b.lat)) * Math.pow(Math.sin(dLng / 2), 2);
    return 2 * this.EARTH_KM * Math.asin(Math.min(1, Math.sqrt(s)));
  },

  activeRoute: function () {
    var db = PARA.store.db;
    return db.routes.filter(function (r) { return r.status === "active"; })[0] || db.routes[0] || null;
  },

  stops: function (routeId) {
    return PARA.store.db.stops
      .filter(function (s) { return !routeId || s.routeId === routeId; })
      .sort(function (a, b) { return a.position - b.position; });
  },

  segmentMinutes: function (fromStop, toStop) {
    if (!fromStop || !toStop) return 5;
    if (fromStop.travelToNext != null) return fromStop.travelToNext;
    if (toStop.travelFromPrev != null) return toStop.travelFromPrev;
    return Math.max(2, Math.round(this.haversine(fromStop, toStop) * 4));
  },

  segments: function (routeId) {
    var list = this.stops(routeId), out = [], acc = 0;
    for (var i = 0; i < list.length - 1; i++) {
      var mins = this.segmentMinutes(list[i], list[i + 1]);
      out.push({ from: list[i], to: list[i + 1], minutes: mins, startWeight: acc, endWeight: acc + mins });
      acc += mins;
    }
    return { list: out, totalWeight: acc };
  },

  totalMinutes: function (routeId) {
    var seg = this.segments(routeId);
    if (seg.list.length) return seg.totalWeight;
    var r = PARA.store.db.routes.filter(function (x) { return x.id === routeId; })[0];
    return r && r.estDurationMin ? r.estDurationMin : 45;
  },

  stopFraction: function (stopId) {
    var stop = PARA.store.db.stops.filter(function (s) { return s.id === stopId; })[0];
    if (!stop) return 0;
    var seg = this.segments(stop.routeId);
    if (!seg.list.length) return 0;
    if (stop.position <= 1) return 0;
    if (stop.position >= this.stops(stop.routeId).length) return 1;
    var match = seg.list.filter(function (s) { return s.to.id === stop.id; })[0];
    if (!match) return 0;
    return match.endWeight / seg.totalWeight;
  },

  coordAt: function (routeId, frac) {
    var list = this.stops(routeId);
    if (!list.length) return null;
    if (list.length === 1) return { lat: list[0].lat, lng: list[0].lng };
    var seg = this.segments(routeId);
    if (!seg.list.length) return { lat: list[0].lat, lng: list[0].lng };
    var target = Math.max(0, Math.min(1, frac)) * seg.totalWeight;
    var chosen = seg.list[seg.list.length - 1];
    for (var i = 0; i < seg.list.length; i++) {
      if (target <= seg.list[i].endWeight) { chosen = seg.list[i]; break; }
    }
    var span = chosen.endWeight - chosen.startWeight || 1;
    var t = Math.max(0, Math.min(1, (target - chosen.startWeight) / span));
    var bow = Math.sin(t * Math.PI) * 0.00035;
    return {
      lat: chosen.from.lat + (chosen.to.lat - chosen.from.lat) * t + bow,
      lng: chosen.from.lng + (chosen.to.lng - chosen.from.lng) * t - bow
    };
  },

  nearestStop: function (routeId, coord) {
    var list = this.stops(routeId), best = null, bestD = Infinity;
    list.forEach(function (s) {
      var d = PARA.geo.haversine(coord, s);
      if (d < bestD) { bestD = d; best = s; }
    });
    return best ? { stop: best, km: bestD } : null;
  },

  activeTrips: function () {
    var db = PARA.store.db;
    return db.trips.filter(function (t) { return t.status !== "completed"; });
  },

  tripSpeedFactor: function (trip) {
    if (trip.status === "temporarily_stopped") return 0;
    if (trip.status === "delayed") return 0.35;
    if (trip.status === "vehicle_problem" || trip.status === "road_problem" || trip.status === "emergency") return 0.15;
    return trip.simFactor || 1;
  },

  tripCoord: function (trip) {
    return this.coordAt(trip.routeId, trip.progress || 0);
  },

  etaMinutes: function (trip, stopId) {
    var target = this.stopFraction(stopId);
    var current = trip.progress || 0;
    if (target <= current) return 0;
    var total = this.totalMinutes(trip.routeId);
    var factor = this.tripSpeedFactor(trip) || 1;
    return Math.max(1, Math.round(((target - current) * total) / factor));
  },

  etaClock: function (trip, stopId) {
    return new Date(Date.now() + this.etaMinutes(trip, stopId) * 60000).toISOString();
  },

  gpsFreshness: function (vehicle) {
    if (vehicle.status === "out_of_service") return "unavailable";
    if (!vehicle.lastGpsAt) return vehicle.status === "offline" ? "unavailable" : "unavailable";
    var age = (Date.now() - new Date(vehicle.lastGpsAt).getTime()) / 1000;
    if (age <= 75) return "active";
    if (age <= 210) return "delayed";
    return "unavailable";
  },

  gpsNote: function (vehicle) {
    var f = this.gpsFreshness(vehicle);
    if (f === "active") return "GPS updating normally";
    if (f === "delayed") return "GPS updates are late — vehicle may still be running";
    return "No recent GPS signal — not the same as the trip being stopped";
  },

  refreshStopEtas: function () {
    var db = PARA.store.db;
    var trips = this.activeTrips();
    db.stops.forEach(function (s) {
      var best = null;
      trips.forEach(function (t) {
        if (t.routeId !== s.routeId) return;
        var mins = PARA.geo.etaMinutes(t, s.id);
        if (mins <= 0) return;
        if (!best || mins < best.mins) best = { mins: mins, trip: t };
      });
      s.eta = best ? PARA.geo.etaClock(best.trip, s.id) : null;
      s.etaTripId = best ? best.trip.id : null;
    });
  },

  mapSvg: function (opts) {
    opts = opts || {};
    var routeId = opts.routeId || (this.activeRoute() || {}).id;
    var list = this.stops(routeId);
    if (!list.length) return "<div class='empty'>No stops configured for this route yet.</div>";

    var lats = list.map(function (s) { return s.lat; });
    var lngs = list.map(function (s) { return s.lng; });
    var minLat = Math.min.apply(null, lats), maxLat = Math.max.apply(null, lats);
    var minLng = Math.min.apply(null, lngs), maxLng = Math.max.apply(null, lngs);
    var padLat = Math.max((maxLat - minLat) * 0.22, 0.0016);
    var padLng = Math.max((maxLng - minLng) * 0.22, 0.0016);
    minLat -= padLat; maxLat += padLat; minLng -= padLng; maxLng += padLng;

    var W = 1000, H = 430;
    var px = function (lng) { return 30 + ((lng - minLng) / (maxLng - minLng)) * (W - 60); };
    var py = function (lat) { return H - 30 - ((lat - minLat) / (maxLat - minLat)) * (H - 60); };

    var pts = list.map(function (s) { return px(s.lng).toFixed(1) + "," + py(s.lat).toFixed(1); });
    var out = [];
    out.push("<svg viewBox='0 0 " + W + " " + H + "' xmlns='http://www.w3.org/2000/svg' role='img' aria-label='Route map'>");
    out.push("<rect width='" + W + "' height='" + H + "' fill='#f2f8f3'/>");
    for (var gx = 0; gx < W; gx += 50) out.push("<line x1='" + gx + "' y1='0' x2='" + gx + "' y2='" + H + "' stroke='#e6efe8' stroke-width='1'/>");
    for (var gy = 0; gy < H; gy += 50) out.push("<line x1='0' y1='" + gy + "' x2='" + W + "' y2='" + gy + "' stroke='#e6efe8' stroke-width='1'/>");

    out.push("<polyline points='" + pts.join(" ") + "' fill='none' stroke='#2e7d32' stroke-width='13' stroke-linecap='round' stroke-linejoin='round' opacity='.85'/>");
    out.push("<polyline points='" + pts.join(" ") + "' fill='none' stroke='#ffffff' stroke-width='3.4' stroke-dasharray='14 12' stroke-linecap='round'/>");

    list.forEach(function (s, i) {
      var x = px(s.lng), y = py(s.lat);
      var isEnd = i === 0 || i === list.length - 1;
      out.push("<circle cx='" + x.toFixed(1) + "' cy='" + y.toFixed(1) + "' r='" + (isEnd ? 11 : 8) + "' fill='" + (isEnd ? "#1b5e20" : "#f9a825") + "' stroke='#fff' stroke-width='3'/>");
      var anchor = x > W - 150 ? "end" : "start";
      var dx = anchor === "end" ? -15 : 15;
      out.push("<text x='" + (x + dx).toFixed(1) + "' y='" + (y + 4).toFixed(1) + "' text-anchor='" + anchor + "' font-size='13' font-weight='700' fill='#16211a'>" + PARA.esc(s.name) + "</text>");
      if (s.eta) {
        out.push("<text x='" + (x + dx).toFixed(1) + "' y='" + (y + 19).toFixed(1) + "' text-anchor='" + anchor + "' font-size='11' fill='#5f6b62'>ETA " + PARA.fmt.time(s.eta) + "</text>");
      }
    });

    var db = PARA.store.db;
    this.activeTrips().forEach(function (trip) {
      if (trip.routeId !== routeId) return;
      var c = PARA.geo.tripCoord(trip);
      if (!c) return;
      var x = px(c.lng), y = py(c.lat);
      var veh = db.vehicles.filter(function (v) { return v.id === trip.vehicleId; })[0];
      var color = trip.status === "delayed" ? "#d93025"
        : trip.status === "temporarily_stopped" ? "#f9a825"
        : trip.status === "emergency" ? "#b3261e" : "#14682c";
      out.push("<g transform='translate(" + x.toFixed(1) + "," + y.toFixed(1) + ")'>");
      out.push("<circle r='21' fill='" + color + "' opacity='.16'/>");
      out.push("<circle r='12' fill='" + color + "' stroke='#fff' stroke-width='3'/>");
      out.push("<text y='4.5' text-anchor='middle' font-size='12' fill='#fff' font-weight='700'>" + PARA.esc(veh ? veh.name.charAt(0) : "B") + "</text>");
      out.push("</g>");
      if (veh) {
        out.push("<text x='" + x.toFixed(1) + "' y='" + (y - 24).toFixed(1) + "' text-anchor='middle' font-size='11.5' font-weight='700' fill='#16211a'>" + PARA.esc(veh.name) + "</text>");
      }
    });

    out.push("</svg>");
    return out.join("");
  }
};

PARA.sim = {
  timer: null,
  lastTick: null,

  start: function () {
    if (this.timer) return;
    this.lastTick = Date.now();
    var self = this;
    this.timer = setInterval(function () { self.tick(); }, 4000);
  },

  stop: function () { if (this.timer) { clearInterval(this.timer); this.timer = null; } },

  tick: function () {
    var db = PARA.store.db;
    if (!db) return;
    var now = Date.now();
    var dtMin = Math.max(0, (now - (this.lastTick || now)) / 60000);
    this.lastTick = now;
    if (dtMin <= 0) return;

    var changed = false;
    var alerts = [];

    db.trips.forEach(function (trip) {
      if (trip.status === "completed") return;
      var total = PARA.geo.totalMinutes(trip.routeId) || 45;
      var factor = PARA.geo.tripSpeedFactor(trip);
      if (!trip.simFactor) trip.simFactor = 1;

      if (Math.random() < 0.02) {
        trip.simFactor = Math.random() < 0.6 ? 0.6 + Math.random() * 0.25 : 1 + Math.random() * 0.2;
        if (trip.simFactor < 0.85 && trip.status === "active") {
          trip.status = "delayed";
          trip.delayMin = Math.round(total * (1 - (1 / trip.simFactor)) * 0.6);
          trip.delayReason = PARA.CONST.delayReason[Math.floor(Math.random() * 4)];
          alerts.push(trip);
        } else if (trip.simFactor >= 0.85 && trip.status === "delayed") {
          trip.status = "active";
          trip.delayMin = 0;
        }
      }

      var advance = (dtMin / total) * factor;
      trip.progress = Math.min(1.35, (trip.progress || 0) + advance);
      var coord = PARA.geo.tripCoord(trip);
      if (coord) {
        trip.lastCoord = coord;
        var veh = db.vehicles.filter(function (v) { return v.id === trip.vehicleId; })[0];
        if (veh) {
          veh.lastGpsAt = new Date().toISOString();
          veh.lastCoord = coord;
          veh.speedKph = Math.round(18 + Math.random() * 22);
          db.gps.push({
            id: PARA.store.uid("gps"), vehicleId: veh.id, driverId: trip.driverId, tripId: trip.id,
            lat: coord.lat, lng: coord.lng, at: new Date().toISOString(), speedKph: veh.speedKph, accuracyM: 8 + Math.round(Math.random() * 22)
          });
        }
        db.gps.push({
          id: PARA.store.uid("gps"), vehicleId: trip.vehicleId, driverId: trip.driverId, tripId: trip.id,
          lat: coord.lat, lng: coord.lng, at: new Date().toISOString(), speedKph: null, accuracyM: null
        });
      }

      var mins = (now - new Date(trip.startAt).getTime()) / 60000;
      if (mins > 240 && trip.status !== "emergency") {
        trip.status = "delayed";
        trip.dataQuality = "long_running";
        alerts.push({ longRun: true, trip: trip });
      }

      if (trip.progress >= 1) {
        var list = PARA.geo.stops(trip.routeId);
        trip.progress = 1;
        trip.endAt = new Date().toISOString();
        trip.durationMin = Math.round(mins);
        trip.endLoc = list.length ? list[list.length - 1].name : trip.startLoc;
        trip.status = "completed";
        trip.gpsStatus = "stopped";
        var v2 = db.vehicles.filter(function (v) { return v.id === trip.vehicleId; })[0];
        if (v2) v2.status = "available";
        changed = true;
      }
    });

    if (db.gps.length > 600) db.gps.splice(0, db.gps.length - 600);

    db.vehicles.forEach(function (v) {
      var fresh = PARA.geo.gpsFreshness(v);
      if (v.gpsStatus !== fresh) { v.gpsStatus = fresh; changed = true; }
      if (v.status === "on_trip" || v.status === "active" || v.status === "delayed") {
        var trip = db.trips.filter(function (t) { return t.vehicleId === v.id && t.status !== "completed"; })[0];
        if (!trip && (v.status === "on_trip" || v.status === "active" || v.status === "delayed")) {
          v.status = "available";
          changed = true;
        } else if (trip) {
          var want = trip.status === "delayed" ? "delayed" : trip.status === "emergency" ? "emergency"
            : trip.status === "temporarily_stopped" ? "temporarily_stopped" : "on_trip";
          if (v.status !== want) { v.status = want; changed = true; }
        }
      }
    });

    PARA.geo.refreshStopEtas();
    if (changed || alerts.length) PARA.store.save();
    if (alerts.length && typeof PARA.onSimAlert === "function") PARA.onSimAlert(alerts);
  }
};


/* --- assets/analytics.js --- */
window.PARA = window.PARA || {};

PARA.analytics = {
  RANGES: [
    { id: "today", label: "Today", days: 1 },
    { id: "week", label: "Last 7 days", days: 7 },
    { id: "month", label: "Last 30 days", days: 30 },
    { id: "all", label: "All recorded data", days: 3650 }
  ],

  range: function (id) {
    var def = this.RANGES.filter(function (r) { return r.id === id; })[0] || this.RANGES[1];
    var to = new Date();
    var from = new Date(to.getTime() - def.days * 86400000);
    if (def.id === "today") { from.setHours(0, 0, 0, 0); }
    return { id: def.id, label: def.label, from: from, to: to };
  },

  within: function (iso, r) {
    if (!iso) return false;
    var t = new Date(iso).getTime();
    return t >= r.from.getTime() && t <= r.to.getTime();
  },

  avg: function (nums) {
    var f = nums.filter(function (n) { return typeof n === "number" && !isNaN(n); });
    if (!f.length) return null;
    return f.reduce(function (a, b) { return a + b; }, 0) / f.length;
  },

  median: function (nums) {
    var f = nums.filter(function (n) { return typeof n === "number" && !isNaN(n); }).sort(function (a, b) { return a - b; });
    if (!f.length) return null;
    var mid = Math.floor(f.length / 2);
    return f.length % 2 ? f[mid] : (f[mid - 1] + f[mid]) / 2;
  },

  max: function (nums) {
    var f = nums.filter(function (n) { return typeof n === "number" && !isNaN(n); });
    return f.length ? Math.max.apply(null, f) : null;
  },

  min: function (nums) {
    var f = nums.filter(function (n) { return typeof n === "number" && !isNaN(n); });
    return f.length ? Math.min.apply(null, f) : null;
  },

  tripsIn: function (r) {
    return PARA.store.db.trips.filter(function (t) { return this.within(t.startAt, r); }, this);
  },

  requestsIn: function (r) {
    return PARA.store.db.requests.filter(function (q) {
      return this.within(q.createdAt || q.date, r);
    }, this);
  },

  hourKey: function (iso) { return new Date(iso).getHours(); },

  demandByHour: function (r) {
    var buckets = [], i;
    for (i = 0; i < 24; i++) buckets.push({ hour: i, requests: 0, must: 0, served: 0, trips: 0, passengers: 0 });
    this.requestsIn(r).forEach(function (q) {
      var h = PARA.analytics.hourKey(q.desiredTime || q.date);
      if (!buckets[h]) return;
      buckets[h].requests++;
      if (q.sensitivity === "must_arrive_by") buckets[h].must++;
      if (q.status === "served") buckets[h].served++;
    });
    this.tripsIn(r).forEach(function (t) {
      var h = PARA.analytics.hourKey(t.startAt);
      if (!buckets[h]) return;
      buckets[h].trips++;
      buckets[h].passengers += t.passengers || 0;
    });
    return buckets;
  },

  demandByDow: function (r) {
    var names = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
    var buckets = names.map(function (n) { return { day: n, requests: 0, passengers: 0, trips: 0 }; });
    this.requestsIn(r).forEach(function (q) {
      var d = new Date(q.desiredTime || q.date).getDay();
      buckets[d].requests++;
    });
    this.tripsIn(r).forEach(function (t) {
      var d = new Date(t.startAt).getDay();
      buckets[d].trips++;
      buckets[d].passengers += t.passengers || 0;
    });
    return buckets;
  },

  demandByStop: function (r) {
    var db = PARA.store.db;
    return db.stops.slice().sort(function (a, b) { return a.position - b.position; }).map(function (s) {
      var asOrigin = 0, asDest = 0, waitSamples = [], servedAsDest = 0;
      db.requests.forEach(function (q) {
        if (PARA.analytics.within(q.createdAt || q.date, r)) {
          if (q.originId === s.id) asOrigin++;
          if (q.destId === s.id) { asDest++; if (q.status === "served") servedAsDest++; }
        }
      });
      db.waitingTimes.forEach(function (w) {
        if (w.stopId === s.id && PARA.analytics.within(w.arrivedAt, r)) waitSamples.push(w.waitMin);
      });
      return {
        stop: s, requests: asOrigin + asDest, asOrigin: asOrigin, asDest: asDest,
        avgWait: this.avg(waitSamples), maxWait: this.max(waitSamples),
        waitSamples: waitSamples.length, fulfilled: asDest ? Math.round((servedAsDest / asDest) * 100) : null
      };
    }, this);
  },

  demandBySensitivity: function (r) {
    var out = PARA.CONST.sensitivity.map(function (s) { return { key: s, label: PARA.CONST.sensitivityLabel[s], count: 0, served: 0 }; });
    this.requestsIn(r).forEach(function (q) {
      var row = out.filter(function (o) { return o.key === q.sensitivity; })[0];
      if (!row) return;
      row.count++;
      if (q.status === "served") row.served++;
    });
    return out;
  },

  peak: function (r) {
    var hourly = this.demandByHour(r);
    var top = hourly.slice().sort(function (a, b) { return b.requests - a.requests; }).slice(0, 3);
    var morning = hourly.slice(5, 10).reduce(function (a, b) { return a + b.requests; }, 0);
    var midday = hourly.slice(10, 15).reduce(function (a, b) { return a + b.requests; }, 0);
    var evening = hourly.slice(15, 21).reduce(function (a, b) { return a + b.requests; }, 0);
    var schoolPeak = hourly[7].requests + hourly[15].requests + hourly[16].requests;
    var workPeak = hourly[6].requests + hourly[7].requests + hourly[8].requests + hourly[17].requests + hourly[18].requests;
    var total = hourly.reduce(function (a, b) { return a + b.requests; }, 0);
    return {
      hours: top, total: total,
      morning: morning, midday: midday, evening: evening,
      schoolPeak: schoolPeak, workPeak: workPeak,
      quietest: hourly.slice().sort(function (a, b) { return a.requests - b.requests; })[0],
      busiest: top[0]
    };
  },

  tripStats: function (r) {
    var trips = this.tripsIn(r);
    var pax = trips.map(function (t) { return t.passengers || 0; });
    var dur = trips.map(function (t) { return t.durationMin; });
    var delay = trips.map(function (t) { return t.delayMin || 0; });
    var delayed = trips.filter(function (t) { return (t.delayMin || 0) > 0; });
    return {
      count: trips.length,
      passengers: pax.reduce(function (a, b) { return a + b; }, 0),
      avgPax: this.avg(pax),
      maxPax: this.max(pax),
      avgDuration: this.avg(dur),
      minDuration: this.min(dur),
      maxDuration: this.max(dur),
      avgDelay: this.avg(delay),
      delayedTrips: delayed.length,
      delayRate: trips.length ? Math.round((delayed.length / trips.length) * 100) : 0,
      completed: trips.filter(function (t) { return t.status === "completed"; }).length
    };
  },

  waitStats: function (r) {
    var db = PARA.store.db;
    var rows = db.waitingTimes.filter(function (w) { return this.within(w.arrivedAt, r); }, this);
    var mins = rows.map(function (w) { return w.waitMin; });
    var byHour = [];
    var i;
    for (i = 0; i < 24; i++) byHour.push({ hour: i, samples: [], sum: 0 });
    rows.forEach(function (w) {
      var h = new Date(w.arrivedAt).getHours();
      byHour[h].samples.push(w.waitMin);
    });
    byHour = byHour.map(function (b) {
      return { hour: b.hour, count: b.samples.length, avg: PARA.analytics.avg(b.samples) };
    });
    return {
      count: rows.length, avg: this.avg(mins), median: this.median(mins),
      max: this.max(mins), min: this.min(mins), byHour: byHour
    };
  },

  travelStats: function (r) {
    var db = PARA.store.db;
    var rows = db.travelTimes.filter(function (t) { return this.within(t.endedAt, r); }, this);
    var mins = rows.map(function (t) { return t.minutes; });
    var bySeg = {};
    rows.forEach(function (t) {
      var key = t.fromStopId + ">" + t.toStopId;
      if (!bySeg[key]) bySeg[key] = { fromStopId: t.fromStopId, toStopId: t.toStopId, samples: [] };
      bySeg[key].samples.push(t.minutes);
    });
    var segments = Object.keys(bySeg).map(function (k) {
      var s = bySeg[k];
      return {
        from: s.fromStopId, to: s.toStopId, count: s.samples.length,
        avg: PARA.analytics.avg(s.samples), max: PARA.analytics.max(s.samples), min: PARA.analytics.min(s.samples)
      };
    }).sort(function (a, b) { return (b.avg || 0) - (a.avg || 0); });
    var stopName = function (id) {
      var s = db.stops.filter(function (x) { return x.id === id; })[0];
      return s ? s.name : "Unknown stop";
    };
    return {
      count: rows.length, avg: this.avg(mins), min: this.min(mins), max: this.max(mins),
      segments: segments.map(function (s) {
        return { fromName: stopName(s.from), toName: stopName(s.to), count: s.count, avg: s.avg, max: s.max, min: s.min };
      })
    };
  },

  delayStats: function (r) {
    var db = PARA.store.db;
    var rows = db.delays.filter(function (d) { return this.within(d.detectedAt, r); }, this);
    var byReason = {};
    rows.forEach(function (d) {
      byReason[d.reason] = (byReason[d.reason] || 0) + 1;
    });
    var byStop = {};
    rows.forEach(function (d) {
      if (!d.stopId) return;
      byStop[d.stopId] = (byStop[d.stopId] || 0) + 1;
    });
    var stopName = function (id) {
      var s = db.stops.filter(function (x) { return x.id === id; })[0];
      return s ? s.name : "Unspecified";
    };
    return {
      count: rows.length,
      avgDelay: this.avg(rows.map(function (d) { return d.delayMin; })),
      maxDelay: this.max(rows.map(function (d) { return d.delayMin; })),
      reasons: Object.keys(byReason).map(function (k) { return { reason: k, count: byReason[k] }; }).sort(function (a, b) { return b.count - a.count; }),
      hotspots: Object.keys(byStop).map(function (k) { return { stopName: stopName(k), count: byStop[k] }; }).sort(function (a, b) { return b.count - a.count; })
    };
  },

  capacity: function (r) {
    var db = PARA.store.db;
    var hourlyCapacity = {};
    this.tripsIn(r).forEach(function (t) {
      var h = PARA.analytics.hourKey(t.startAt);
      hourlyCapacity[h] = (hourlyCapacity[h] || 0) + (t.capacityAtTime || 0);
    });
    var hourly = this.demandByHour(r);
    var rows = hourly.map(function (b) {
      var cap = hourlyCapacity[b.hour] || 0;
      var util = cap ? Math.round((b.requests / cap) * 100) : null;
      return {
        hour: b.hour, requests: b.requests, capacity: cap, passengers: b.passengers,
        utilization: util,
        pressure: util == null ? "unknown" : util >= 100 ? "over" : util >= 75 ? "high" : util >= 40 ? "moderate" : "low"
      };
    });
    var measured = rows.filter(function (x) { return x.capacity > 0; });
    return {
      rows: rows,
      totalCapacity: measured.reduce(function (a, b) { return a + b.capacity; }, 0),
      totalRequests: hourly.reduce(function (a, b) { return a + b.requests; }, 0),
      avgUtilization: this.avg(measured.map(function (x) { return x.utilization; })),
      pressureHours: rows.filter(function (x) { return x.pressure === "over" || x.pressure === "high"; }),
      fleetCapacity: db.vehicles.filter(function (v) { return v.status !== "out_of_service"; })
        .reduce(function (a, v) { return a + (v.capacity || 0); }, 0)
    };
  },

  unmet: function (r) {
    var rows = this.requestsIn(r);
    var served = rows.filter(function (q) { return q.status === "served"; });
    var notServed = rows.filter(function (q) { return q.status !== "served" && q.status !== "submitted" && q.status !== "assigned"; });
    var byStatus = {};
    notServed.forEach(function (q) { byStatus[q.status] = (byStatus[q.status] || 0) + 1; });
    var mustNotServed = notServed.filter(function (q) { return q.sensitivity === "must_arrive_by"; });
    return {
      total: rows.length,
      served: served.length,
      servedRate: rows.length ? Math.round((served.length / rows.length) * 100) : 0,
      unmet: notServed.length,
      mustNotServed: mustNotServed.length,
      byStatus: Object.keys(byStatus).map(function (k) { return { status: k, count: byStatus[k] }; }).sort(function (a, b) { return b.count - a.count; })
    };
  },

  fleet: function () {
    var db = PARA.store.db;
    return {
      total: db.vehicles.length,
      inService: db.vehicles.filter(function (v) { return v.status !== "out_of_service"; }).length,
      onTrip: db.vehicles.filter(function (v) { return v.status === "on_trip"; }).length,
      delayed: db.vehicles.filter(function (v) { return v.status === "delayed"; }).length,
      gpsIssues: db.vehicles.filter(function (v) { return PARA.geo.gpsFreshness(v) !== "active" && v.status !== "out_of_service"; }),
      seats: db.vehicles.filter(function (v) { return v.status !== "out_of_service"; }).reduce(function (a, v) { return a + (v.capacity || 0); }, 0)
    };
  },

  drivers: function () {
    var db = PARA.store.db;
    return {
      total: db.drivers.length,
      active: db.drivers.filter(function (d) { return d.status === "active"; }).length,
      suspended: db.drivers.filter(function (d) { return d.status === "suspended"; }).length,
      unassigned: db.drivers.filter(function (d) { return d.status === "active" && !d.vehicleId; }).length
    };
  },

  dataQuality: function (r) {
    var db = PARA.store.db;
    var flags = [];
    db.vehicles.forEach(function (v) {
      if (v.status === "out_of_service") return;
      var fresh = PARA.geo.gpsFreshness(v);
      if (fresh !== "active") {
        flags.push({ severity: fresh === "unavailable" ? "high" : "medium", kind: "GPS signal", subject: v.name, detail: PARA.geo.gpsNote(v) });
      }
    });
    this.tripsIn(r).forEach(function (t) {
      var mins = (Date.now() - new Date(t.startAt).getTime()) / 60000;
      if (t.status !== "completed" && mins > 240) flags.push({ severity: "high", kind: "Long-running trip", subject: t.code, detail: "Open for " + Math.round(mins) + " minutes" });
      if (t.status === "completed" && (t.passengers == null)) flags.push({ severity: "medium", kind: "Missing passenger count", subject: t.code, detail: "Completed trip has no passenger count recorded" });
      if (t.status === "completed" && t.durationMin > 150) flags.push({ severity: "medium", kind: "Unusually long trip", subject: t.code, detail: t.durationMin + " minutes recorded" });
      if (t.status === "completed" && t.durationMin && t.durationMin < 10) flags.push({ severity: "medium", kind: "Unusually short trip", subject: t.code, detail: t.durationMin + " minutes recorded" });
    });
    db.requests.forEach(function (q) {
      if (q.status === "unknown") flags.push({ severity: "low", kind: "Unresolved request", subject: q.code, detail: "Outcome never confirmed" });
    });
    return flags;
  },

  dailySummary: function (dateIso) {
    var day = dateIso ? new Date(dateIso) : new Date();
    day.setHours(0, 0, 0, 0);
    var r = { id: "custom", label: day.toDateString(), from: day, to: new Date(day.getTime() + 86400000 - 1) };
    var s = this.tripStats(r), w = this.waitStats(r), c = this.capacity(r);
    return {
      date: day, trips: s.count, passengers: s.passengers, requests: c.totalRequests,
      avgWait: w.avg, avgDuration: s.avgDuration, delays: s.delayedTrips,
      fleetActive: this.fleet().onTrip, serviceStatus: PARA.store.db.serviceStatus
    };
  },

  trend: function (weeks) {
    var out = [], now = new Date();
    var n = weeks || 8;
    for (var i = n - 1; i >= 0; i--) {
      var end = new Date(now.getTime() - i * 7 * 86400000);
      var start = new Date(end.getTime() - 6 * 86400000);
      var r = { id: "custom", label: "Week of " + start.toLocaleDateString([], { month: "short", day: "numeric" }), from: start, to: end };
      var s = this.tripStats(r), w = this.waitStats(r), c = this.capacity(r);
      out.push({ label: r.label, trips: s.count, passengers: s.passengers, requests: c.totalRequests, avgWait: w.avg, avgDuration: s.avgDuration, delays: s.delayedTrips });
    }
    return out;
  },

  patterns: function (r) {
    var hourly = this.demandByHour(r);
    var found = [];
    hourly.forEach(function (b) {
      if (b.requests >= 3) {
        var reasons = [];
        if (b.hour === 7 || b.hour === 15 || b.hour === 16) reasons.push("school hours pattern");
        if (b.hour >= 6 && b.hour <= 9) reasons.push("morning commuting pattern");
        if (b.hour >= 17 && b.hour <= 19) reasons.push("evening return pattern");
        if (b.hour >= 11 && b.hour <= 13) reasons.push("midday errand pattern");
        if (reasons.length) {
          found.push({
            label: (b.hour < 10 ? "0" : "") + b.hour + ":00–" + ((b.hour + 1) < 10 ? "0" : "") + (b.hour + 1) + ":00",
            requests: b.requests, passengers: b.passengers, trips: b.trips,
            note: "Consistent with a " + reasons.join(" and ") + " based on recorded requests"
          });
        }
      }
    });
    var dow = this.demandByDow(r);
    var busyDay = dow.slice().sort(function (a, b) { return b.requests - a.requests; })[0];
    var quietDay = dow.slice().sort(function (a, b) { return a.requests - b.requests; })[0];
    if (busyDay && busyDay.requests > 0) {
      found.push({ label: busyDay.day, requests: busyDay.requests, passengers: busyDay.passengers, trips: busyDay.trips, note: "Highest recorded demand day of the week" });
    }
    if (quietDay && quietDay.requests >= 0 && busyDay && quietDay.day !== busyDay.day) {
      found.push({ label: quietDay.day, requests: quietDay.requests, passengers: quietDay.passengers, trips: quietDay.trips, note: "Lowest recorded demand day of the week" });
    }
    return found;
  },

  correlations: function (r) {
    var out = [];
    var hourly = this.demandByHour(r);
    var trips = this.tripsIn(r);
    var wait = this.waitStats(r);
    var travel = this.travelStats(r);

    var byHourDur = {};
    trips.forEach(function (t) {
      var h = PARA.analytics.hourKey(t.startAt);
      (byHourDur[h] = byHourDur[h] || []).push(t.durationMin);
    });
    var durPairs = [];
    hourly.forEach(function (b) {
      if (byHourDur[b.hour] && b.requests > 0) durPairs.push({ x: b.requests, y: PARA.analytics.avg(byHourDur[b.hour]) });
    });
    if (durPairs.length >= 3) {
      var r1 = PARA.analytics.correlation(durPairs.map(function (p) { return p.x; }), durPairs.map(function (p) { return p.y; }));
      out.push({
        a: "Passenger requests vs trip duration by hour",
        r: r1,
        reading: r1 > 0.4 ? "Busier hours are associated with longer trips" : r1 < -0.4 ? "Busier hours are associated with shorter trips" : "No clear relationship between request volume and trip duration in the recorded window"
      });
    }
    if (wait.count >= 3) {
      var peakWaitHours = wait.byHour.filter(function (h) { return h.count >= 1; }).sort(function (a, b) { return (b.avg || 0) - (a.avg || 0); })[0];
      if (peakWaitHours) {
        out.push({
          a: "Waiting time by hour of day",
          r: null,
          reading: "Longest average wait recorded at " + (peakWaitHours.hour < 10 ? "0" : "") + peakWaitHours.hour + ":00 (" + PARA.fmt.mins(peakWaitHours.avg) + " across " + peakWaitHours.count + " samples)"
        });
      }
    }
    if (travel.segments.length) {
      var worst = travel.segments[0];
      out.push({
        a: "Travel time by stop segment",
        r: null,
        reading: "Slowest segment is " + worst.fromName + " → " + worst.toName + " at " + PARA.fmt.mins(worst.avg) + " average across " + worst.count + " recorded runs"
      });
    }
    return out;
  },

  correlation: function (xs, ys) {
    var n = Math.min(xs.length, ys.length);
    if (n < 3) return null;
    var mx = 0, my = 0, i;
    for (i = 0; i < n; i++) { mx += xs[i]; my += ys[i]; }
    mx /= n; my /= n;
    var num = 0, dx = 0, dy = 0;
    for (i = 0; i < n; i++) {
      var a = xs[i] - mx, b = ys[i] - my;
      num += a * b; dx += a * a; dy += b * b;
    }
    if (dx === 0 || dy === 0) return 0;
    return Math.round((num / Math.sqrt(dx * dy)) * 100) / 100;
  },

  planTrip: function (originId, destId, desiredIso, sensitivity) {
    var route = PARA.geo.activeRoute();
    if (!route) return { ok: false, error: "No active route is configured yet." };
    var list = PARA.geo.stops(route.id);
    var from = list.filter(function (s) { return s.id === originId; })[0];
    var to = list.filter(function (s) { return s.id === destId; })[0];
    if (!from) return { ok: false, error: "Choose a starting stop." };
    if (!to) return { ok: false, error: "Choose a destination stop." };
    if (from.id === to.id) return { ok: false, error: "Starting stop and destination are the same." };

    var forward = from.position < to.position;
    var ordered = list.filter(function (s) {
      return forward ? s.position > from.position && s.position <= to.position : s.position < from.position && s.position >= to.position;
    });
    if (!ordered.length) ordered = [to];

    var rideMin = 0;
    ordered.forEach(function (s) {
      var idx = list.indexOf(s);
      var prev = list[idx - 1];
      if (prev) rideMin += PARA.geo.segmentMinutes(prev, s);
    });
    if (!rideMin) rideMin = 8;

    var last7 = PARA.analytics.travelStats(PARA.analytics.range("week"));
    var segSamples = [];
    ordered.forEach(function (s) {
      var idx = list.indexOf(s), prev = list[idx - 1];
      if (!prev) return;
      last7.segments.forEach(function (seg) {
        if ((seg.fromName === prev.name && seg.toName === s.name)) segSamples.push(seg.avg);
      });
    });
    var observedRide = PARA.analytics.avg(segSamples);
    var typicalRide = observedRide != null ? Math.round(observedRide * ordered.length) : rideMin;

    var bufferMin = sensitivity === "must_arrive_by" ? 12 : sensitivity === "prefer_to_arrive_by" ? 8 : 5;
    var boardBufferMin = 6;

    var desired = new Date(desiredIso);
    if (isNaN(desired.getTime())) return { ok: false, error: "Enter a valid desired arrival time." };

    var liveTrips = PARA.geo.activeTrips().filter(function (t) { return t.routeId === route.id; });
    var bestLive = null;
    liveTrips.forEach(function (t) {
      var mins = PARA.geo.etaMinutes(t, to.id);
      if (mins <= 0) return;
      if (!bestLive || mins < bestLive.mins) bestLive = { mins: mins, trip: t };
    });

    var nextDeparture = new Date();
    if (bestLive) {
      nextDeparture = new Date(Date.now() + bestLive.mins * 60000);
    } else {
      var firstStop = list[0];
      var [hh, mm] = String(route.operatingHours.start || "06:00").split(":").map(Number);
      var candidate = new Date(desired);
      candidate.setHours(hh, mm, 0, 0);
      if (candidate < new Date()) candidate = new Date();
      nextDeparture = candidate;
    }

    var arriveBy = new Date(nextDeparture.getTime() + typicalRide * 60000);
    var recommendedLeave = new Date(nextDeparture.getTime() - boardBufferMin * 60000);
    if (recommendedLeave < new Date()) recommendedLeave = new Date();

    return {
      ok: true,
      route: route,
      from: from, to: to, ordered: ordered,
      typicalRideMin: typicalRide,
      plannedRideMin: rideMin,
      usingObserved: observedRide != null,
      observedRideMin: observedRide,
      bufferMin: bufferMin,
      boardBufferMin: boardBufferMin,
      nextDeparture: nextDeparture,
      arriveBy: arriveBy,
      recommendedLeave: recommendedLeave,
      live: bestLive,
      desired: desired,
      withinDesired: arriveBy <= desired,
      basis: observedRide != null
        ? "Historical average of " + segSamples.length + " recorded segment" + (segSamples.length === 1 ? "" : "s") + " between these stops"
        : "Planned scheduled travel time for these segments (no completed runs recorded yet)"
    };
  },

  exportCsv: function (filename, headers, rows) {
    var esc = function (v) {
      if (v == null) return "";
      var s = String(v);
      return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
    };
    var lines = [headers.map(esc).join(",")];
    rows.forEach(function (r) { lines.push(r.map(esc).join(",")); });
    var blob = new Blob(["\uFEFF" + lines.join("\r\n")], { type: "text/csv;charset=utf-8" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
  }
};

    var p = PARA.store.db.passengers.filter(function (x) { return x.userId === u.id; })[0];

        "<div class='card'><div class='card-head'><h3>Profile</h3></div>" +

            "<li><div class='stop-num'>R</div><div><strong>Access level</strong><div class='stop-meta' style='text-transform:capitalize'>" + PARA.esc(u.role) + "</div></div></li>" +

          "<div id='pw-err'></div>" +

            PARA.ui.field("New password", "<input class='in' name='next' type='password' required minlength='6'>") +
            PARA.ui.field("Confirm new password", "<input class='in' name='confirm' type='password' required minlength='6'>") +
            "<button class='btn' type='submit'>Update password</button>" +
          "</form>" +
          (p ? "<div class='card-head' style='margin-top:22px'><h3>Alert preferences</h3></div>" +
            "<form id='pref-form'>" +
              ["serviceInterruption:Service interruption alerts", "majorDelay:Major delay alerts", "announcements:General announcements", "vehicleArrival:Vehicle approaching my stop"].map(function (pair) {
                var k = pair.split(":")[0], lbl = pair.split(":").slice(1).join(":");
                return "<label class='chk'><input type='checkbox' name='" + k + "'" + (p.prefs[k] ? " checked" : "") + "><span>" + PARA.esc(lbl) + "</span></label>";
              }).join("") +
              "<label class='chk' style='margin-top:8px'><input type='checkbox' name='sms'" + (p.sms ? " checked" : "") + "><span>Send me SMS alerts (mobile " + PARA.esc(p.contact || "not set") + ")</span></label>" +
              "<button class='btn ghost' type='submit' style='margin-top:10px'>Save preferences</button>" +
            "</form>" : "") +
        "</div>" +
      "</div>";

    root.querySelector("#pw-form").addEventListener("submit", function (e) {
      e.preventDefault();
      var f = new FormData(e.target);

        root.querySelector("#pw-err").innerHTML = "<div class='alert err'>Current password is not correct.</div>";
        return;
      }

      });

  function kpi(label, value, kind, note) {

      "<div class='l'>" + PARA.esc(label) + "</div>" +

  function hourlyChart(buckets, key, label) {
    var max = Math.max.apply(null, buckets.map(function (b) { return b[key] || 0; }).concat([1]));
    return "<div class='card'><div class='card-head'><h3>" + PARA.esc(label) + "</h3>" +
      "<span class='card-note'>Peak " + max + " · bars show recorded counts per hour</span></div>" +
      "<div class='bars'>" + buckets.map(function (b) {
        var h = Math.max(3, Math.round(((b[key] || 0) / max) * 150));
        var peak = (b[key] || 0) === max && max > 0;
        return "<div class='bar-col' title='" + b.hour + ":00 — " + (b[key] || 0) + "'>" +
          "<div class='bar-val'>" + (b[key] || 0) + "</div>" +
          "<div class='bar" + (peak ? " peak" : "") + "' style='height:" + h + "px'></div>" +
          "<div class='bar-lab'>" + (b.hour % 3 === 0 ? (b.hour < 10 ? "0" : "") + b.hour : "") + "</div>" +
        "</div>";
      }).join("") + "</div></div>";

              "<td class='card-note'>" + PARA.esc(PARA.fmt.date(d.registeredAt)) + "</td>" +

                  : "<button class='btn sm' data-activate='" + d.id + "'>Reactivate</button>") +
                "<button class='btn ghost sm' data-assign='" + d.id + "'>Assign vehicle</button>" +

        "</tbody></table></div></div>";

      root.querySelector("#add-driver").addEventListener("click", function () {

            "<div class='row2'>" +
              PARA.ui.field("Driver ID", "<input class='in' name='code' placeholder='DRV-004' required>") +
              PARA.ui.field("Contact number", "<input class='in' name='contact'>") +
            "</div>" +
            "<div class='row2'>" +
              PARA.ui.field("Login username", "<input class='in' name='username' required>") +
              PARA.ui.field("Temporary password", "<input class='in' name='password' type='text' value='driver123' required>") +
            "</div>" +
            PARA.ui.field("License number", "<input class='in' name='license'>") +
            PARA.ui.field("Assign vehicle (optional)", "<select class='in' name='vehicleId'><option value=''>Assign later</option>" +

            "<div class='alert info'>The account is created in a pending state. Activate it below to let the driver sign in.</div>",
          onOk: function (box) {
            var f = new FormData(box.querySelector("form") || box);
            var get = function (n) { var el = box.querySelector("[name='" + n + "']"); return el ? el.value : ""; };
            if (db.users.some(function (x) { return x.username.toLowerCase() === get("username").toLowerCase(); })) {
              PARA.ui.toast("That username is already taken", "bad"); return false;
            }
            if (db.drivers.some(function (x) { return x.code.toLowerCase() === get("code").toLowerCase(); })) {
              PARA.ui.toast("That driver ID already exists", "bad"); return false;
            }
            var uid = PARA.store.uid("usr");
            db.users.push({
              id: uid, username: get("username"), password: get("password") || "driver123", role: "driver",
              fullName: get("fullName"), email: null, phone: get("contact"), active: true, activated: false,
              mustChangePassword: true, createdAt: new Date().toISOString(), lastLoginAt: null
            });
            var drv = {
              id: PARA.store.uid("drv"), userId: uid, code: get("code"), fullName: get("fullName"),
              contact: get("contact"), license: get("license"), status: "inactive", activation: "pending",
              vehicleId: get("vehicleId") || null, registeredAt: new Date().toISOString()
            };
            db.drivers.push(drv);
            var veh = db.vehicles.filter(function (v) { return v.id === drv.vehicleId; })[0];
            if (veh) veh.driverId = drv.id;
            PARa_record("register_driver", "driver", drv.id, "Registered " + drv.code + " " + drv.fullName);
            PARA.store.save();
            PARA.ui.toast("Driver registered. Activate the account to allow sign-in.", "good");
            render();
          }
        });
      });

      root.querySelectorAll("[data-activate]").forEach(function (b) {
        b.addEventListener("click", function () {
          var d = db.drivers.filter(function (x) { return x.id === b.getAttribute("data-activate"); })[0];
          var u = db.users.filter(function (x) { return x.id === d.userId; })[0];
          d.status = "active"; d.activation = "activated";
          if (u) { u.active = true; u.activated = true; }
          PARa_record("activate_driver", "driver", d.id, "Activated " + d.code);
          PARA.store.save();
          PARA.ui.toast(d.fullName + " activated", "good");
          render();
        });
      });

      root.querySelectorAll("[data-suspend]").forEach(function (b) {
        b.addEventListener("click", function () {
          var id = b.getAttribute("data-suspend");
          var d = db.drivers.filter(function (x) { return x.id === id; })[0];
          PARA.ui.confirm("Deactivate driver", "Deactivate " + d.fullName + "? They will not be able to sign in and any running trip stays on record.", function () {
            var u = db.users.filter(function (x) { return x.id === d.userId; })[0];
            d.status = "suspended"; d.activation = "deactivated";
            if (u) { u.active = false; u.activated = false; }
            PARa_record("deactivate_driver", "driver", d.id, "Deactivated " + d.code);
            PARA.store.save();
            PARA.ui.toast(d.fullName + " deactivated");
            render();
          }, "Deactivate");
        });

      root.querySelectorAll("[data-assign]").forEach(function (b) {

          PARA.ui.modal({
            title: "Assign vehicle to " + d.fullName,
            body: PARA.ui.field("Vehicle", "<select class='in' id='assign-sel'><option value=''>No vehicle</option>" +
              db.vehicles.map(function (v) {
                var taken = db.drivers.filter(function (x) { return x.vehicleId === v.id && x.id !== d.id; })[0];
                return "<option value='" + v.id + "'" + (d.vehicleId === v.id ? " selected" : "") + ">" +
                  PARA.esc(v.code + " — " + v.name) + (taken ? " (assigned to " + PARA.esc(taken.fullName) + ")" : "") + "</option>";
              }).join("") + "</select>"),
            onOk: function (box) {
              var val = box.querySelector("#assign-sel").value;
              db.drivers.forEach(function (x) { if (x.vehicleId && (!val || x.id !== d.id) && db.vehicles.some(function (v) { return v.id === x.vehicleId; })) { var v0 = db.vehicles.filter(function (v) { return v.id === x.vehicleId; })[0]; if (v0 && v0.driverId === x.id) v0.driverId = null; } });
              d.vehicleId = val || null;
              if (val) { var v = db.vehicles.filter(function (x) { return x.id === val; })[0]; if (v) v.driverId = d.id; }
              PARa_record("assign_vehicle", "driver", d.id, "Vehicle assignment updated for " + d.code);
              PARA.store.save();
              PARA.ui.toast("Vehicle assignment updated", "good");
              render();
            }
          });
        });
      });

      root.querySelectorAll("[data-activity]").forEach(function (b) {
        b.addEventListener("click", function () {
          var d = db.drivers.filter(function (x) { return x.id === b.getAttribute("data-activity"); })[0];
          var trips = db.trips.filter(function (t) { return t.driverId === d.id; }).sort(function (a, b2) { return new Date(b2.startAt) - new Date(a.startAt); });
          var total = trips.reduce(function (a, t) { return a + (t.passengers || 0); }, 0);
          PARA.ui.modal({
            wide: true,
            title: "Driver activity — " + d.fullName,
            footer: false,
            body:
              "<div class='grid g3' style='margin-bottom:16px'>" +
                kpi("Trips", trips.length) +
                kpi("Passengers", total) +
                kpi("Avg trip", PARA.fmt.mins(PARA.analytics.avg(trips.map(function (t) { return t.durationMin; })))) +
              "</div>" +
              (trips.length ? "<div class='table-wrap'><table class='t'><thead><tr><th>Trip</th><th>Started</th><th>Ended</th><th class='num'>Pax</th><th class='num'>Duration</th><th>Status</th></tr></thead><tbody>" +
                trips.map(function (t) {
                  return "<tr><td>" + PARA.esc(t.code) + "</td><td>" + PARA.esc(PARA.fmt.dateTime(t.startAt)) + "</td>" +
                    "<td>" + (t.endAt ? PARA.esc(PARA.fmt.dateTime(t.endAt)) : "—") + "</td>" +
                    "<td class='num'>" + (t.passengers || 0) + "</td><td class='num'>" + PARA.esc(PARA.fmt.mins(t.durationMin)) + "</td>" +
                    "<td>" + PARA.tag(t.status, PARA.CONST.tripLabel[t.status]) + "</td></tr>";
                }).join("") + "</tbody></table></div>" : "<div class='empty'>This driver has not completed any trips yet.</div>")
          });
        });
      });
    }
    render();
  };

  V["admin-route"] = function (root) {
